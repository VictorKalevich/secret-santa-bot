# Cloudflare Worker «Тайный Санта»
name = "secret-santa-bot"
# Аккаунт Cloudflare первого бота (`npx wrangler whoami`). Не секрет. Нужен, когда вход Wrangler видит несколько
# аккаунтов, иначе он спросит, куда выкатывать. Свою установку — свой id или удалите строку.
account_id = "c9b5da37ad9113f8827e00327cebb6e4"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Раз в минуту: уведомления об изменении писем, напоминания, отправка очереди сообщений
[triggers]
crons = ["* * * * *"]

# База данных. После `npx wrangler d1 create secret-santa-db` впишите сюда database_id из ответа.
[[d1_databases]]
binding = "DB"
database_name = "secret-santa-db"
database_id = "d9d60a6e-623e-427f-8eda-4a1f634c5af4"
migrations_dir = "migrations"   # схема базы — только миграциями (см. README)

# Настройки (не секретные)
[vars]
TIMEZONE_OFFSET_HOURS = "3"   # Минск, UTC+3
REMINDER_HOUR = "10"          # во сколько по местному времени слать ежедневные напоминания
NOTIFY_DELAY_MINUTES = "10"   # пауза после последней правки письма перед уведомлением Санте

# HTML и CSS подключаются как текст (мини-приложение + дизайн-система)
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
fallthrough = true

[observability]
enabled = true

# Второй бот — тот же код на своём аккаунте Cloudflare (свои бесплатные лимиты, база, секреты).
# Все команды для него — с `--env second` (README, «Второй бот»). Код, cron, rules и observability окружение берёт
# сверху; базу и vars Wrangler не наследует — они здесь, vars держите такими же, как наверху.
[env.second]
name = "secret-santa-bot-2"
account_id = "ВПИШИТЕ_ACCOUNT_ID_ВТОРОГО_АККАУНТА"

[[env.second.d1_databases]]
binding = "DB"
database_name = "secret-santa-db-2"
database_id = "ВПИШИТЕ_DATABASE_ID_ИЗ_D1_CREATE"
migrations_dir = "migrations"

[env.second.vars]
TIMEZONE_OFFSET_HOURS = "3"
REMINDER_HOUR = "10"
NOTIFY_DELAY_MINUTES = "10"
