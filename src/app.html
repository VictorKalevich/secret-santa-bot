<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Тайный Санта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Стили — только дизайн-система (design-system/tokens.css + components.css), сервер встраивает их сюда. -->
<style>/*@design-system*/</style>
</head>
<body class="ds-root">
<header class="ds-hero">
  <div class="ds-hero__badge">🎅</div>
  <div>
    <h1 class="ds-hero__title">Тайный Санта</h1>
    <div class="ds-hero__subtitle" id="heroSub">Загрузка…</div>
  </div>
</header>
<nav class="ds-tabs" id="tabs" hidden></nav>
<main class="ds-page" id="main"><div class="ds-loader"><div class="ds-spinner"></div>Загрузка…</div></main>
<div class="ds-toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  const hashData = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');
  const initData = (tg && tg.initData) || hashData || '';
  const ver = (v) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (ver('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {}
  }

  // ---------- утилиты ----------
  // Создание элементов: пользовательский текст всегда вставляется как текст, не как HTML.
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const ui = {
    section: (title) => h('div', { class: 'ds-section-title' }, title),
    card: (...c) => h('div', { class: 'ds-card ds-stack' }, ...c),
    hint: (text, extra) => h('div', { class: 'ds-hint' + (extra ? ' ' + extra : '') }, text),
    btn: (label, variant, extra) => h('button', { class: 'ds-btn' + (variant ? ' ds-btn--' + variant : '') + (extra ? ' ' + extra : '') }, label),
    switchEl: (input) => h('label', { class: 'ds-switch' }, input, h('span', { class: 'ds-switch__track' })),
    toggleRow: (title, sub, input, extra) => h('div', { class: 'ds-row ds-row--between' + (extra ? ' ' + extra : '') },
      h('div', {}, h('div', { class: 'ds-text-strong' }, title), sub ? ui.hint(sub) : null), ui.switchEl(input)),
    empty: (icon, title, text, action) => h('div', { class: 'ds-card ds-empty' },
      h('div', { class: 'ds-empty__icon' }, icon), h('h3', { class: 'ds-empty__title' }, title),
      h('div', { class: 'ds-text-muted' }, text), action || null),
    chip: (text, kind) => h('span', { class: 'ds-chip' + (kind ? ' ds-chip--' + kind : '') }, text),
    textarea: (attrs) => autosize(h('textarea', { class: 'ds-input', ...attrs })),
  };

  async function api(action, body) {
    let res;
    try {
      res = await fetch('/api/' + action, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-init-data': initData },
        body: JSON.stringify(body || {}),
      });
    } catch (e) {
      throw new Error('Нет связи с сервером. Проверь интернет.');
    }
    const data = await res.json().catch(() => ({ ok: false, error: 'Ошибка сервера' }));
    if (!data.ok) throw new Error(data.error || 'Ошибка');
    return data;
  }

  let toastTimer;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('ds-toast--visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('ds-toast--visible'), 2600);
  }
  function haptic(kind) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
  }
  function confirmBox(text) {
    return new Promise((resolve) => {
      if (tg && ver('6.2')) {
        try { tg.showConfirm(text.slice(0, 250), (ok) => resolve(!!ok)); return; } catch (e) {}
      }
      resolve(window.confirm(text));
    });
  }
  async function busy(btn, fn) {
    if (btn) btn.disabled = true;
    try { return await fn(); }
    catch (e) { haptic('error'); toast('⚠️ ' + e.message); }
    finally { if (btn) btn.disabled = false; }
  }
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function fmtDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${+m[3]} ${MONTHS[+m[2] - 1]}` : '';
  }
  function fmtTime(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const now = new Date();
    const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'сегодня в ' + hm;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'вчера в ' + hm;
    return `${d.getDate()} ${MONTHS[d.getMonth()]} в ${hm}`;
  }
  function autosize(el) {
    const fit = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };
    el.addEventListener('input', fit);
    requestAnimationFrame(fit);
    return el;
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  // ---------- сравнение версий письма (по словам) ----------
  function diffTokens(a, b) {
    let start = 0;
    while (start < a.length && start < b.length && a[start] === b[start]) start++;
    let endA = a.length, endB = b.length;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
    const A = a.slice(start, endA), B = b.slice(start, endB);
    const n = A.length, m = B.length;
    if (n * m > 4e6) return null;
    const W = m + 1;
    const dp = new Uint16Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i * W + j] = A[i] === B[j] ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
    const ops = [];
    const push = (t, s) => { const last = ops[ops.length - 1]; if (last && last.t === t) last.s += s; else ops.push({ t, s }); };
    if (start) push('=', a.slice(0, start).join(''));
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { push('=', A[i]); i++; j++; }
      else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { push('-', A[i]); i++; }
      else { push('+', B[j]); j++; }
    }
    while (i < n) push('-', A[i++]);
    while (j < m) push('+', B[j++]);
    if (endA < a.length) push('=', a.slice(endA).join(''));
    return ops;
  }
  function renderDiff(oldText, newText) {
    const tok = (s) => s.match(/\s+|[^\s]+/g) || [];
    const ops = diffTokens(tok(oldText), tok(newText));
    const box = h('div', { class: 'ds-letter' });
    if (!ops) { box.textContent = newText; return box; }
    for (const op of ops) {
      if (op.t === '=') { box.append(op.s); continue; }
      // Пробелы и переносы по краям — вне подсветки; удалённые пробелы не показываем
      const [, lead, core, trail] = /^(\s*)([\s\S]*?)(\s*)$/.exec(op.s);
      if (op.t === '+') box.append(lead);
      if (core) box.append(h(op.t === '+' ? 'mark' : 'del', { class: op.t === '+' ? 'ds-diff-add' : 'ds-diff-del' }, core));
      if (op.t === '+') box.append(trail);
    }
    return box;
  }

  // ---------- состояние ----------
  const state = { me: null, game: null, tab: 'my', dirty: false, wardNameShown: false };
  const main = document.getElementById('main');

  function setDirty(v) {
    state.dirty = v;
    try { if (tg && ver('6.2')) v ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {}
    renderTabs();
  }

  function renderHero() {
    const g = state.game || {};
    const parts = [];
    if (g.event_date) parts.push('🎁 ' + fmtDate(g.event_date));
    if (g.budget) parts.push('💰 ' + g.budget);
    if (!parts.length && state.me) parts.push('Привет, ' + state.me.name + '!');
    document.getElementById('heroSub').textContent = parts.join(' · ');
  }

  function tabsList() {
    const t = [];
    if (state.me.is_participant) t.push(['my', '✉️', 'Письмо'], ['ward', '🎁', 'Подопечный']);
    t.push(['info', 'ℹ️', 'Инфо']);
    if (state.me.is_admin) t.push(['admin', '🛠', 'Админ']);
    return t;
  }

  // Точка на вкладке: несохранённое письмо или непрочитанные сообщения переписки (003)
  function tabHasDot(id) {
    const u = (state.me && state.me.unread) || {};
    if (id === 'my') return state.dirty || u.from_santa > 0;
    if (id === 'ward') return u.from_ward > 0;
    return false;
  }

  // Кнопка «💬 Написать …» с числом непрочитанных
  function chatButton(withWhom) {
    const n = ((state.me && state.me.unread) || {})[withWhom === 'ward' ? 'from_ward' : 'from_santa'] || 0;
    const btn = ui.btn(withWhom === 'ward' ? '💬 Написать подопечному' : '💬 Написать Санте', 'secondary', 'ds-btn--block');
    if (n) btn.append(h('span', { class: 'ds-badge' }, String(n)));
    btn.addEventListener('click', () => openChat(withWhom));
    return btn;
  }

  function renderTabs() {
    const nav = document.getElementById('tabs');
    nav.hidden = false;
    nav.replaceChildren(...tabsList().map(([id, icon, label]) =>
      h('button', {
        class: 'ds-tab' + (state.tab === id ? ' ds-tab--active' : ''),
        onclick: async () => {
          if (state.tab === id) return;
          if (state.dirty && !(await confirmBox('Письмо не сохранено. Уйти без сохранения?'))) return;
          if (state.dirty) setDirty(false);
          state.tab = id;
          render();
        },
      }, h('span', { class: 'ds-tab__icon' }, icon), h('span', { class: 'ds-tab__label' }, label),
        tabHasDot(id) ? h('span', { class: 'ds-tab__dot' }) : null)
    ));
  }

  async function reloadMe() {
    const d = await api('me');
    if (!d.registered) return d;
    state.me = d.me;
    state.game = d.game;
    state.limits = d.limits;
    return d;
  }

  function render() {
    renderHero();
    renderTabs();
    window.scrollTo(0, 0);
    ({ my: renderMy, ward: renderWard, info: renderInfo, admin: renderAdmin }[state.tab] || renderInfo)();
  }

  function showLoader() { main.replaceChildren(h('div', { class: 'ds-loader' }, h('div', { class: 'ds-spinner' }), 'Загрузка…')); }
  function showError(e) {
    main.replaceChildren(ui.empty('⚠️', 'Не получилось загрузить', e.message,
      h('button', { class: 'ds-btn ds-btn--secondary ds-empty__action', onclick: () => render() }, 'Попробовать снова')));
  }

  // ---------- вкладка «Моё письмо» ----------
  function renderMy() {
    const me = state.me;
    const max = state.limits.chars;
    const ta = ui.textarea({
      class: 'ds-input ds-input--letter',
      placeholder: 'Дорогой Санта! В этом году я мечтаю о…\n\nНапиши, что хочешь получить, что любишь, размеры одежды, любимые цвета — и чего точно не надо.',
      value: me.wishlist,
    });
    const counter = h('span', { class: 'ds-counter' });
    const saveBtn = ui.btn('Сохранить', '', 'ds-btn--block');
    const status = h('span', { class: 'ds-hint' });
    const update = () => {
      const n = ta.value.length;
      counter.textContent = `${n} / ${max} символов`;
      counter.classList.toggle('ds-counter--over', n > max);
      const changed = ta.value !== me.wishlist;
      saveBtn.disabled = !changed || n > max;
      if (changed !== state.dirty) setDirty(changed);
      status.textContent = changed ? 'Есть несохранённые изменения' : me.wishlist_updated_at ? 'Сохранено ' + fmtTime(me.wishlist_updated_at) : '';
    };
    ta.addEventListener('input', update);
    saveBtn.addEventListener('click', () => busy(saveBtn, async () => {
      const r = await api('wishlist.save', { text: ta.value });
      me.wishlist = ta.value;
      me.wishlist_updated_at = r.updated_at;
      setDirty(false);
      update();
      haptic('success');
      toast(me.has_santa ? '✅ Сохранено. Санта получит уведомление' : '✅ Письмо сохранено');
    }));

    const nodes = [
      ui.section('Письмо Тайному Санте'),
      ui.card(
        ui.hint(`Его увидит только твой Санта. Менять можно в любой момент — даже после жеребьёвки. До ${max} символов — столько помещается в одно сообщение Telegram.`),
        ta,
        h('div', { class: 'ds-row ds-row--between' }, counter, status),
        saveBtn),
    ];
    if (me.has_santa) {
      nodes.push(
        ui.section('Переписка с Сантой'),
        ui.card(ui.hint('Хочешь что-то уточнить или ответить на вопрос? Напиши своему Тайному Санте. Ты не знаешь, кто он, а он знает тебя.'), chatButton('santa')));
    }
    main.replaceChildren(...nodes);
    update();
  }

  // ---------- вкладка «Подопечный» ----------
  async function renderWard() {
    showLoader();
    let d;
    try { d = await api('ward.get'); } catch (e) { return showError(e); }
    if (state.tab !== 'ward') return;
    if (d.state !== 'ok') {
      main.replaceChildren(d.state === 'no_draw'
        ? ui.empty('🎲', 'Жеребьёвка ещё не проведена', 'Как только организатор её проведёт, здесь появится имя и письмо твоего подопечного. Бот пришлёт уведомление.')
        : ui.empty('⏳', 'Скоро тебя добавят', 'Ты присоединился после жеребьёвки. Организатор впишет тебя — и бот пришлёт уведомление.'));
      return;
    }
    const nameEl = h('div', { class: 'ds-ward-card__name' + (state.wardNameShown ? '' : ' ds-ward-card__name--hidden') }, d.ward.name);
    const toggle = ui.btn(state.wardNameShown ? '🙈 Скрыть' : '👀 Показать имя', 'sm', 'ds-btn--on-festive');
    toggle.addEventListener('click', () => {
      state.wardNameShown = !state.wardNameShown;
      nameEl.classList.toggle('ds-ward-card__name--hidden', !state.wardNameShown);
      toggle.textContent = state.wardNameShown ? '🙈 Скрыть' : '👀 Показать имя';
    });

    const text = d.ward.wishlist || '';
    let letter;
    if (!text.trim()) {
      letter = h('div', { class: 'ds-text-muted' }, 'Подопечный пока ничего не написал. Можно спросить его в переписке — кнопка ниже 👇');
    } else if (d.previous !== null && d.previous !== undefined) {
      letter = h('div', { class: 'ds-stack' },
        h('div', { class: 'ds-notice ds-text-sm' }, '✨ Письмо изменилось с твоего прошлого просмотра: новое ',
          h('mark', { class: 'ds-diff-add' }, 'выделено'), ', удалённое ', h('del', { class: 'ds-diff-del' }, 'зачёркнуто'), '.'),
        renderDiff(d.previous, text));
    } else {
      letter = h('div', { class: 'ds-letter' }, text);
    }

    const gift = h('input', { type: 'checkbox', checked: d.gift_ready });
    gift.addEventListener('change', () => busy(null, async () => {
      await api('ward.gift', { ready: gift.checked });
      haptic('success');
      toast(gift.checked ? '🎉 Отлично! Подарок отмечен как готовый' : 'Отметка снята');
    }));

    main.replaceChildren(
      h('div', { class: 'ds-ward-card' }, h('div', { class: 'ds-ward-card__label' }, 'Ты — Тайный Санта для'), nameEl, toggle),
      ui.section('Письмо подопечного'),
      ui.card(letter, d.ward.updated_at && text.trim() ? ui.hint('Обновлено ' + fmtTime(d.ward.updated_at)) : null),
      h('div', { class: 'ds-card' }, ui.toggleRow('🎁 Подарок готов', 'Видно только организатору — для статистики', gift)),
      ui.section('Переписка с подопечным'),
      ui.card(ui.hint('Есть вопрос? Напиши подопечному — для него ты «Тайный Санта», имя не раскрывается.'), chatButton('ward')));
  }

  // ---------- вкладка «Инфо» ----------
  function renderInfo() {
    const g = state.game;
    const me = state.me;
    const rows = [];
    if (g.budget) rows.push(['Бюджет', g.budget]);
    if (g.event_date) rows.push(['Вручение', fmtDate(g.event_date)]);
    if (g.place) rows.push(['Где', g.place]);
    if (g.deadline) rows.push(['Письмо до', fmtDate(g.deadline)]);
    rows.push(['Участников', String(g.participants)]);
    rows.push(['Жеребьёвка', g.draw_done ? 'проведена ✅' : 'ещё не проведена']);

    const nodes = [
      ui.section('Об игре'),
      h('div', { class: 'ds-card' }, h('dl', { class: 'ds-info-grid' }, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))),
    ];
    if (g.notes) nodes.push(h('div', { class: 'ds-card ds-letter' }, g.notes));

    if (me.is_participant) {
      const modes = [['sound', '🔔 Звук'], ['silent', '🔕 Тихо'], ['off', '🚫 Выкл']];
      const seg = h('div', { class: 'ds-segmented' });
      const draw = () => seg.replaceChildren(...modes.map(([k, label]) => h('button', {
        class: 'ds-segmented__item' + (me.notify_mode === k ? ' ds-segmented__item--on' : ''),
        onclick: () => busy(null, async () => {
          await api('notify.set', { mode: k });
          me.notify_mode = k;
          draw();
          toast('Сохранено');
        }),
      }, label)));
      draw();
      nodes.push(
        ui.section('Уведомления'),
        ui.card(ui.hint('Когда подопечный меняет письмо, бот сообщит об этом — без имени и подробностей, чтобы никто не подсмотрел на экране блокировки.'), seg));
    }

    nodes.push(
      ui.section('Как это работает'),
      h('div', { class: 'ds-card' }, h('ul', { class: 'ds-bullets' },
        h('li', {}, 'Напиши письмо Санте — его увидит только тот, кто будет дарить тебе подарок.'),
        h('li', {}, 'После жеребьёвки во вкладке «Подопечный» появится, кому даришь ты.'),
        h('li', {}, 'Никто, даже организатор, не видит, кто кому дарит.'),
        h('li', {}, 'Через бота можно анонимно задать вопрос подопечному или написать своему Санте.'))));
    main.replaceChildren(...nodes);
  }

  // ---------- вкладка «Админ» ----------
  async function renderAdmin() {
    showLoader();
    let d;
    try { d = await api('admin.state'); } catch (e) { return showError(e); }
    if (state.tab !== 'admin') return;
    const s = d.settings;
    const users = d.users;
    const byId = Object.fromEntries(users.map((u) => [u.id, u]));
    const players = users.filter((u) => u.registered && u.is_participant);
    const me = state.me;
    const refresh = async () => { await reloadMe().catch(() => {}); renderHero(); renderTabs(); await renderAdmin(); };
    const nodes = [];

    // --- приглашение
    const regToggle = h('input', { type: 'checkbox', checked: s.registration_open });
    regToggle.addEventListener('change', () => busy(null, async () => {
      await api('admin.registration', { open: regToggle.checked });
      toast(regToggle.checked ? 'Регистрация открыта' : 'Регистрация закрыта');
    }));
    const linkInput = h('input', { class: 'ds-input', type: 'text', value: s.invite_link || 'Сначала открой /setup (см. инструкцию)', readonly: true });
    const copyBtn = ui.btn('📋 Копировать', 'secondary', 'ds-btn--sm');
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(s.invite_link); toast('Ссылка скопирована'); }
      catch (e) { linkInput.select(); toast('Выдели и скопируй ссылку'); }
    });
    const shareBtn = ui.btn('📤 Отправить в чат', 'secondary', 'ds-btn--sm');
    shareBtn.addEventListener('click', () => {
      const url = 'https://t.me/share/url?url=' + encodeURIComponent(s.invite_link) + '&text=' + encodeURIComponent('🎄 Играем в Тайного Санту! Заходи по ссылке:');
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
    });
    const regenBtn = ui.btn('🔄 Новая ссылка', 'danger', 'ds-btn--sm');
    regenBtn.addEventListener('click', async () => {
      if (!(await confirmBox('Создать новую ссылку? Старая перестанет работать (уже зарегистрированных это не затронет).'))) return;
      busy(regenBtn, async () => { await api('admin.invite.regen'); toast('Ссылка обновлена'); await renderAdmin(); });
    });
    const regCard = ui.card(
      ui.toggleRow('Регистрация открыта', 'Закрывается автоматически после жеребьёвки', regToggle),
      linkInput,
      h('div', { class: 'ds-row ds-row--wrap' }, copyBtn, shareBtn, regenBtn));
    if (!s.draw_done) {
      const partToggle = h('input', { type: 'checkbox', checked: me.is_participant });
      partToggle.addEventListener('change', () => busy(null, async () => {
        await api('admin.participate', { on: partToggle.checked });
        toast(partToggle.checked ? 'Ты участвуешь' : 'Ты только организатор');
        await refresh();
      }));
      regCard.append(ui.toggleRow('Я тоже участвую', 'Выключи, если ты только организатор', partToggle, 'ds-divided'));
    }
    nodes.push(ui.section('Приглашение'), regCard);

    // --- участники
    const filled = players.filter((u) => u.has_wishlist).length;
    const list = h('div', { class: 'ds-card ds-card--flush' });
    if (!users.length) list.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Пока никого нет.'));
    for (const u of users) {
      const chips = [];
      if (!u.registered) chips.push(ui.chip('регистрируется…'));
      else if (!u.is_participant) chips.push(ui.chip('только организатор'));
      else {
        chips.push(u.has_wishlist ? ui.chip('✉️ письмо есть', 'success') : ui.chip('✉️ письма нет', 'warning'));
        if (s.draw_done) {
          if (u.in_draw) chips.push(u.gift_ready ? ui.chip('🎁 готов', 'success') : ui.chip('🎁 не готов'));
          else chips.push(ui.chip('не в жеребьёвке', 'warning'));
        }
      }
      if (u.is_owner) chips.push(ui.chip('👑 владелец'));
      else if (u.is_admin) chips.push(ui.chip('🛠 админ'));
      const actions = h('div', { class: 'ds-row ds-row--tight' });
      if (u.registered && u.is_participant) {
        actions.append(h('button', { class: 'ds-icon-btn', title: 'Посмотреть письмо', onclick: async () => {
          if (!(await confirmBox(`Открыть письмо участника «${u.name}»? Ты увидишь его содержимое.`))) return;
          busy(null, async () => {
            const w = await api('admin.wishlist', { id: u.id });
            openSheet('Письмо: ' + w.name, w.wishlist ? h('div', { class: 'ds-card ds-letter' }, w.wishlist) : h('div', { class: 'ds-card ds-text-muted' }, 'Письмо пустое.'));
          });
        } }, '👁'));
      }
      if (u.registered) {
        actions.append(h('button', { class: 'ds-icon-btn', title: 'Переименовать', onclick: () => {
          const inp = h('input', { class: 'ds-input', type: 'text', value: u.name, maxlength: 40 });
          const ok = ui.btn('Сохранить', '', 'ds-btn--block');
          ok.addEventListener('click', () => busy(ok, async () => { await api('admin.rename', { id: u.id, name: inp.value }); closeSheet(); toast('Имя изменено'); await refresh(); }));
          openSheet('Имя участника', ui.card(inp, ok));
        } }, '✏️'));
      }
      // Владельца удалить нельзя; админов удаляет только владелец (002, FR-106)
      if (u.id !== me.id && !u.is_owner && (!u.is_admin || me.is_owner)) {
        actions.append(h('button', { class: 'ds-icon-btn', title: 'Удалить', onclick: async () => {
          const extra = s.draw_done && u.in_draw ? ' Жеребьёвка будет аккуратно поправлена: новый подопечный появится только у его Санты.' : '';
          if (!(await confirmBox(`Удалить участника «${u.name || 'без имени'}» из игры?${extra}`))) return;
          busy(null, async () => { await api('admin.remove', { id: u.id }); toast('Участник удалён'); await renderAdmin(); });
        } }, '🗑'));
      }
      list.append(h('div', { class: 'ds-list-item' },
        h('div', { class: 'ds-grow' },
          h('div', { class: 'ds-list-item__title' }, u.name || 'без имени', u.username ? h('span', { class: 'ds-hint ds-text-regular' }, '  @' + u.username) : null),
          h('div', { class: 'ds-chips' }, chips)),
        actions));
      if (s.draw_done && u.registered && u.is_participant && !u.in_draw) {
        const ins = ui.btn('Вписать в жеребьёвку', '', 'ds-btn--sm');
        ins.addEventListener('click', async () => {
          if (!(await confirmBox(`Вписать «${u.name}» в жеребьёвку? У одного из участников сменится подопечный — бот его предупредит.`))) return;
          busy(ins, async () => { await api('admin.insert', { id: u.id }); toast('Готово'); await renderAdmin(); });
        });

    const remindBtn = ui.btn('⏰ Напомнить тем, у кого нет письма', 'secondary', 'ds-btn--block');
    remindBtn.addEventListener('click', () => busy(remindBtn, async () => {
      const r = await api('admin.remind.unfilled');
      toast(r.count ? `Напоминание отправлено: ${r.count}` : 'Все уже написали письма 👍');
    }));
    nodes.push(
      ui.section(`Участники · ${players.length}`),
      ui.hint(`Письма написали ${filled} из ${players.length}. Содержимое писем открывается только по кнопке 👁.`, 'ds-hint--inset'),
      list,
      players.length > filled ? remindBtn : null);

    // --- администраторы (002)
    const admins = users.filter((u) => u.is_admin).sort((a, b) => (b.is_owner ? 1 : 0) - (a.is_owner ? 1 : 0));
    const adminList = h('div', { class: 'ds-card ds-card--flush' });
    for (const u of admins) {
      const actions = h('div', { class: 'ds-row ds-row--tight' });
      if (me.is_owner && !u.is_owner) {
        actions.append(
          h('button', { class: 'ds-icon-btn', title: 'Передать права владельца', onclick: async () => {
            if (!(await confirmBox(`Передать права владельца «${u.name}»? Ты останешься администратором, но назначать и снимать админов сможет только новый владелец.`))) return;
            busy(null, async () => { await api('admin.owner.transfer', { id: u.id }); toast('👑 Права владельца переданы'); await refresh(); });
          } }, '👑'),
          h('button', { class: 'ds-icon-btn', title: 'Снять права администратора', onclick: async () => {
            if (!(await confirmBox(`Снять права администратора с «${u.name}»? Участником игры он(а) останется.`))) return;

          h('div', { class: 'ds-chips' }, u.is_owner ? ui.chip('👑 владелец') : ui.chip('🛠 админ'))),
        actions));
    }
    nodes.push(ui.section('Администраторы'), adminList);
    if (me.is_owner) {
      const candidates = users.filter((u) => u.registered && !u.is_admin);
      if (candidates.length) {
        const sel = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Кого назначить…'), ...candidates.map((u) => h('option', { value: u.id }, u.name)));

        });
        nodes.push(ui.card(ui.hint('Админы ведут игру вместе с тобой. Назначать, снимать админов и передавать права владельца (👑) можешь только ты.'), sel, grant));
      } else {
        nodes.push(ui.hint('Все зарегистрированные участники уже администраторы.', 'ds-hint--inset'));
      }
    } else {
      nodes.push(ui.hint(`Назначать и снимать администраторов может только владелец${s.owner_name ? ' — ' + s.owner_name : ''}.`, 'ds-hint--inset'));
    }

    // --- исключения
    const exList = h('div', { class: 'ds-card ds-card--flush' });
    const seen = new Set();
    const exPairs = [];
    for (const e of d.exclusions) {
      const key = e.giver + ':' + e.receiver;
      if (seen.has(key)) continue;
      const mutual = d.exclusions.some((x) => x.giver === e.receiver && x.receiver === e.giver);
      seen.add(key);
      if (mutual) seen.add(e.receiver + ':' + e.giver);
      exPairs.push({ ...e, mutual });
    }
    if (!exPairs.length) exList.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Исключений нет — подарить может кто угодно кому угодно.'));
    for (const e of exPairs) {
      const a = byId[e.giver]?.name || '?', b = byId[e.receiver]?.name || '?';
      exList.append(h('div', { class: 'ds-list-item' },
        h('div', { class: 'ds-grow' }, e.mutual
          ? [h('b', {}, a), ' и ', h('b', {}, b), ' не дарят друг другу']
          : [h('b', {}, a), ' не дарит ', h('b', {}, b)]),
        h('button', { class: 'ds-icon-btn', title: 'Удалить исключение', onclick: () => busy(null, async () => { await api('admin.exclusion.del', e); await renderAdmin(); }) }, '✕')));
    }
    const opts = (ph) => [h('option', { value: '' }, ph), ...players.map((u) => h('option', { value: u.id }, u.name))];
    const selA = h('select', { class: 'ds-input' }, opts('Кто дарит…'));
    const selB = h('select', { class: 'ds-input' }, opts('…кому НЕ может дарить'));
    const mutual = h('input', { type: 'checkbox', checked: true });
    const addEx = ui.btn('＋ Добавить исключение', 'secondary', 'ds-btn--block');
    addEx.addEventListener('click', () => busy(addEx, async () => {
      if (!selA.value || !selB.value) return toast('Выбери двух людей');
      if (selA.value === selB.value) return toast('Нужны два разных человека');
      await api('admin.exclusion.add', { giver: +selA.value, receiver: +selB.value, mutual: mutual.checked });
      toast('Исключение добавлено');
      await renderAdmin();
    }));
    nodes.push(
      ui.section('Исключения'),
      exList,
      ui.card(
        ui.hint('Например, пары или члены одной семьи. Бот не даст жеребьёвке нарушить эти правила.'),
        selA, selB,
        h('label', { class: 'ds-check' }, mutual, 'и наоборот (в обе стороны)'),
        addEx));

    // --- жеребьёвка
    const drawCard = ui.card();
    if (!s.draw_done) {
      if (s.has_history) {
        const av = h('input', { type: 'checkbox', checked: s.avoid_previous });
        av.addEventListener('change', () => busy(null, () => api('admin.avoid_previous', { on: av.checked })));
        drawCard.append(h('label', { class: 'ds-check' }, av, 'Не повторять пары прошлой игры (если получится)'));
      }
      const drawBtn = ui.btn('🎲 Провести жеребьёвку', 'festive', 'ds-btn--block');
      const result = h('div');
      drawBtn.addEventListener('click', () => busy(drawBtn, async () => {
        const c = await api('admin.draw.check');
        result.replaceChildren();
        if (!c.possible) {
          haptic('error');
          result.append(h('div', { class: 'ds-notice ds-notice--error' }, h('b', {}, 'Жеребьёвка невозможна:'), h('ul', { class: 'ds-bullets' }, c.problems.map((p) => h('li', {}, p)))));
          return;
        }
        let text = `Провести жеребьёвку для ${c.count} ${plural(c.count, 'участника', 'участников', 'участников')}? Отменить её будет нельзя.`;
        if (c.empty_wishlists.length) text += `\n\nПисьма ещё нет у: ${c.empty_wishlists.join(', ')} (его можно написать и позже).`;
        if (c.history_ignored) text += '\n\nНе повторять прошлые пары не получится — их учитывать не будем.';
        if (!(await confirmBox(text))) return;
        const r = await api('admin.draw');
        haptic('success');
        toast(`🎉 Жеребьёвка проведена! Участников: ${r.count}`);
        await refresh();
      }));
      drawCard.append(
        ui.hint('Когда все зарегистрируются — жми. Бот проверит, что исключения можно соблюсти, и разошлёт уведомления. Кто кому дарит, не увидит никто, включая тебя.'),
        drawBtn, result);
    } else {
      const inDraw = players.filter((u) => u.in_draw);
      const ready = inDraw.filter((u) => u.gift_ready).length;
      const remindS = ui.btn('🎁 Напомнить Сантам о подарках', 'secondary', 'ds-btn--block');
      remindS.addEventListener('click', () => busy(remindS, async () => {
        const r = await api('admin.remind.santas');
        toast(r.count ? `Напоминание отправлено: ${r.count}` : 'Все подарки готовы 👍');
      }));
      const reveal = ui.btn(s.revealed ? '🎅 Тайна уже раскрыта' : '🎅 Раскрыть Сант (после праздника)', 'secondary', 'ds-btn--block');
      reveal.addEventListener('click', async () => {
        if (!(await confirmBox('Каждый участник получит сообщение, кто был его Сантой. Делай это после вручения подарков. Раскрыть?'))) return;
        busy(reveal, async () => { const r = await api('admin.reveal'); toast(`Отправлено: ${r.count}`); await renderAdmin(); });
      });
      const ng = ui.btn('♻️ Начать новую игру', 'danger', 'ds-btn--block');
      ng.addEventListener('click', async () => {
        if (!(await confirmBox('Начать новую игру? Текущие пары будут удалены (их запомним, чтобы не повторять), регистрация откроется. Участники и письма сохранятся.'))) return;
        busy(ng, async () => { await api('admin.newgame'); toast('Новая игра начата'); await refresh(); });
      });
      drawCard.append(
        h('div', {}, h('div', { class: 'ds-text-strong' }, '✅ Жеребьёвка проведена'), s.draw_at ? ui.hint(fmtTime(s.draw_at)) : null),
        h('div', { class: 'ds-notice' }, `🎁 Подарки готовы: ${ready} из ${inDraw.length}`),
        remindS, reveal, ng);
    }
    nodes.push(ui.section('Жеребьёвка'), drawCard);

    // --- параметры игры
    const f = {
      budget: h('input', { class: 'ds-input', type: 'text', value: s.budget, placeholder: 'например, до 50 BYN', maxlength: 100 }),
      event_date: h('input', { class: 'ds-input', type: 'date', value: s.event_date }),
      place: h('input', { class: 'ds-input', type: 'text', value: s.place, placeholder: 'например, у Маши дома', maxlength: 200 }),
      deadline: h('input', { class: 'ds-input', type: 'date', value: s.deadline }),
      notes: ui.textarea({ value: s.notes, placeholder: 'Любые правила и детали для всех', rows: 2, maxlength: 2000 }),
    };
    const saveGame = ui.btn('Сохранить', '', 'ds-btn--block');
    saveGame.addEventListener('click', () => busy(saveGame, async () => {
      await api('admin.game', Object.fromEntries(Object.entries(f).map(([k, el]) => [k, el.value])));
      await reloadMe().catch(() => {});
      renderHero();
      haptic('success');
      toast('Сохранено');
    }));
    const field = (label, el) => h('label', { class: 'ds-field' }, h('span', { class: 'ds-field__label' }, label), el);
    nodes.push(
      ui.section('Параметры игры'),
      ui.card(
        field('Бюджет подарка', f.budget),
        field('Дата вручения', f.event_date),
        field('Место', f.place),
        field('Написать письмо до', f.deadline),
        field('Заметки для всех', f.notes),
        ui.hint('Бот сам напомнит: за 2 дня до срока — тем, у кого нет письма; за 2 дня и в день вручения — Сантам без отметки «подарок готов».'),
        saveGame));

    main.replaceChildren(...nodes);
  }

  // ---------- шторка ----------
  let sheetEl = null;
  let sheetOnClose = null;
  function openSheet(title, content, { full = false, onClose = null } = {}) {
    closeSheet();
    const header = h('div', { class: 'ds-row ds-row--between' }, h('h2', { class: 'ds-sheet__title' }, title),
      h('button', { class: 'ds-icon-btn', title: 'Закрыть', onclick: closeSheet }, '✕'));
    sheetEl = h('div', { class: 'ds-sheet-backdrop', onclick: (e) => { if (e.target === sheetEl) closeSheet(); } },
      h('div', { class: full ? 'ds-sheet ds-sheet--full' : 'ds-sheet ds-stack' }, header, ...[].concat(content)));
    sheetOnClose = onClose;
    document.body.append(sheetEl);
    try { if (tg && ver('6.1')) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); } } catch (e) {}
  }
  function closeSheet() {
    if (sheetEl) { sheetEl.remove(); sheetEl = null; }
    try { if (tg && ver('6.1')) { tg.BackButton.hide(); tg.BackButton.offClick(closeSheet); } } catch (e) {}
    const cb = sheetOnClose;
    sheetOnClose = null;
    if (cb) cb();
  }

  // ---------- переписка Санты и подопечного (003) ----------
  function openChat(withWhom) {
    const max = state.limits.chars;
    const list = h('div', { class: 'ds-chat' }, h('div', { class: 'ds-chat__empty' }, 'Загрузка…'));
    const ta = ui.textarea({ class: 'ds-input ds-composer__input', rows: 1, placeholder: 'Сообщение…' });
    const send = ui.btn('Отправить', '', 'ds-composer__send');
    const counter = h('div', { class: 'ds-counter ds-composer__counter', hidden: true });
    let lastId = 0;
    let timer = null;
    const shown = new Set();

    const bubble = (m) => h('div', { class: 'ds-chat__msg ' + (m.mine ? 'ds-chat__msg--mine' : 'ds-chat__msg--theirs') },
      m.text, h('div', { class: 'ds-chat__meta' }, fmtTime(m.created_at)));
    const add = (msgs) => {
      const fresh = msgs.filter((m) => !shown.has(m.id));
      if (!fresh.length) return;
      if (!shown.size) list.replaceChildren();
      for (const m of fresh) { shown.add(m.id); list.append(bubble(m)); lastId = Math.max(lastId, m.id); }
      list.scrollTop = list.scrollHeight;
    };
    const load = async () => {
      const d = await api('chat.get', { with: withWhom, after: lastId });
      if (d.state !== 'ok') { list.replaceChildren(h('div', { class: 'ds-chat__empty' }, 'Переписка недоступна: жеребьёвка ещё не проведена.')); return; }
      if (!lastId && !d.messages.length) {
        list.replaceChildren(h('div', { class: 'ds-chat__empty' }, withWhom === 'ward'
          ? 'Здесь пока пусто. Напиши подопечному — он увидит сообщение от «Тайного Санты» и сможет ответить.'
          : 'Здесь пока пусто. Напиши своему Санте — он ответит здесь же.'));
      }
      add(d.messages);
    };
    const update = () => {
      const n = ta.value.length;
      counter.hidden = n < max - 500;
      counter.textContent = `${n} / ${max}`;
      counter.classList.toggle('ds-counter--over', n > max);
      send.disabled = !ta.value.trim() || n > max;
    };
    ta.addEventListener('input', update);
    send.addEventListener('click', () => busy(send, async () => {
      const r = await api('message.send', { to: withWhom, text: ta.value });
      ta.value = '';
      ta.style.height = 'auto';
      update();
      add([r.message]);
      haptic('success');
    }));
    update();

    openSheet(withWhom === 'ward' ? 'Переписка с подопечным' : 'Твой Тайный Санта',
      [ui.hint(withWhom === 'ward' ? 'Для подопечного ты — «Тайный Санта», имя не раскрывается.' : 'Санта знает, кто ты, а ты его — нет.'),
        list, h('div', { class: 'ds-composer' }, ta, send), counter],
      { full: true, onClose: async () => {
        clearInterval(timer);
        await reloadMe().catch(() => {});
        if (!state.dirty) render(); else renderTabs();
      } });
    load().catch((e) => toast('⚠️ ' + e.message));
    timer = setInterval(() => { if (sheetEl) load().catch(() => {}); }, 6000);
  }

  // ---------- старт ----------
  async function start() {
    const sub = document.getElementById('heroSub');
    if (!initData) {
      sub.textContent = '';
      main.replaceChildren(ui.empty('📱', 'Открой через Telegram', 'Это приложение работает внутри Telegram. Открой чат с ботом и нажми кнопку «🎁 Санта».'));
      return;
    }
    try {
      const d = await reloadMe();
      if (!d.registered) {
        sub.textContent = '';
        main.replaceChildren(ui.empty('🔒', 'Сначала регистрация', 'Перейди по пригласительной ссылке от организатора и напиши боту своё имя. После этого возвращайся сюда.'));
        return;
      }
      if (state.me.is_participant) {
        state.tab = state.game.draw_done && state.me.has_ward && state.me.wishlist.trim() ? 'ward' : 'my';
      } else {
        state.tab = state.me.is_admin ? 'admin' : 'info';
      }
      render();
      // Открыть переписку сразу, если пришли из уведомления (кнопка «💬 Вся переписка»)
      const chat = new URLSearchParams(location.search).get('chat');
      if (chat === 'santa' && state.me.has_santa) openChat('santa');
      if (chat === 'ward' && state.me.has_ward) openChat('ward');
    } catch (e) {
      showError(e);
      sub.textContent = '';
    }
  }
  start();
})();
</script>
</body>
</html>
