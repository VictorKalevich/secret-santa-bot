<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Тайный Санта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Стили — только дизайн-система (design-system/tokens.css + components.css), сервер встраивает их сюда. -->
<style>/*@design-system*/</style>
</head>
<body class="ds-root">
<header class="ds-hero">
  <button class="ds-hero__back" id="heroBack" title="Все события" hidden>‹</button>
  <div class="ds-hero__badge">🎅</div>
  <div class="ds-grow">
    <h1 class="ds-hero__title" id="heroTitle">Тайный Санта</h1>
    <div class="ds-hero__subtitle" id="heroSub">Загрузка…</div>
  </div>
</header>
<nav class="ds-tabs" id="tabs" hidden></nav>
<main class="ds-page" id="main"><div class="ds-loader"><div class="ds-spinner"></div>Загрузка…</div></main>
<div class="ds-toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  const hashData = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');
  const initData = (tg && tg.initData) || hashData || '';
  const ver = (v) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (ver('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {}
  }

  // ---------- утилиты ----------
  // Создание элементов: пользовательский текст всегда вставляется как текст, не как HTML.
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const ui = {
    section: (title) => h('div', { class: 'ds-section-title' }, title),
    card: (...c) => h('div', { class: 'ds-card ds-stack' }, ...c),
    hint: (text, extra) => h('div', { class: 'ds-hint' + (extra ? ' ' + extra : '') }, text),
    btn: (label, variant, extra) => h('button', { class: 'ds-btn' + (variant ? ' ds-btn--' + variant : '') + (extra ? ' ' + extra : '') }, label),
    switchEl: (input) => h('label', { class: 'ds-switch' }, input, h('span', { class: 'ds-switch__track' })),
    toggleRow: (title, sub, input, extra) => {
      input.setAttribute('aria-label', title); // имя переключателя для экранного диктора (009)
      return h('div', { class: 'ds-row ds-row--between' + (extra ? ' ' + extra : '') },
        h('div', {}, h('div', { class: 'ds-text-strong' }, title), sub ? ui.hint(sub) : null), ui.switchEl(input));
    },
    empty: (icon, title, text, action) => h('div', { class: 'ds-card ds-empty' },
      h('div', { class: 'ds-empty__icon' }, icon), h('h3', { class: 'ds-empty__title' }, title),
      h('div', { class: 'ds-text-muted' }, text), action || null),
    chip: (text, kind) => h('span', { class: 'ds-chip' + (kind ? ' ds-chip--' + kind : '') }, text),
    textarea: (attrs) => autosize(h('textarea', { class: 'ds-input', ...attrs })),
    date: (value) => closeOnReset(h('input', { class: 'ds-input', type: 'date', value })),
  };

  // Поле даты (011): «Сбросить» в системном календаре очищает поле и закрывает календарь (iOS сам его не закрывает).
  // Календарь закрывается вместе с фокусом поля. Очистка с клавиатуры (ПК: Backspace по частям даты) фокус не снимает.
  function closeOnReset(el) {
    let keyAt = 0;
    el.addEventListener('keydown', () => { keyAt = Date.now(); });
    const onClear = () => {
      if (el.value || Date.now() - keyAt < 1000 || document.activeElement !== el) return;
      setTimeout(() => el.blur(), 0);
    };
    el.addEventListener('input', onClear);
    el.addEventListener('change', onClear);
    return el;
  }

  async function api(action, body) {
    let res;
    try {
      res = await fetch('/api/' + action, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-init-data': initData },
        body: JSON.stringify(body || {}),
      });
    } catch (e) {
      throw new Error('Нет связи с сервером. Проверь интернет.');
    }
    const data = await res.json().catch(() => ({ ok: false, error: 'Ошибка сервера' }));
    if (!data.ok) throw new Error(data.error || 'Ошибка');
    return data;
  }

  let toastTimer;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('ds-toast--visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('ds-toast--visible'), 2600);
  }
  function haptic(kind) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
  }
  function confirmBox(text) {
    return new Promise((resolve) => {
      if (tg && ver('6.2')) {
        try { tg.showConfirm(text.slice(0, 250), (ok) => resolve(!!ok)); return; } catch (e) {}
      }
      resolve(window.confirm(text));
    });
  }
  async function busy(btn, fn) {
    if (btn) btn.disabled = true;
    try { return await fn(); }
    catch (e) { haptic('error'); toast('⚠️ ' + e.message); }
    finally { if (btn) btn.disabled = false; }
  }
  // Переключатель с немедленным сохранением (009): пока идёт запрос — недоступен; при ошибке (или если fn вернула
  // false — например, отказ в подтверждении) возвращается в прежнее положение.
  function bindToggle(input, fn) {
    input.addEventListener('change', async () => {
      const on = input.checked;
      input.disabled = true;
      try {
        if ((await fn(on)) === false) input.checked = !on;
      } catch (e) {
        input.checked = !on;
        haptic('error');
        toast('⚠️ ' + e.message);
      } finally {
        input.disabled = false;
      }
    });
    return input;
  }
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function fmtDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${+m[3]} ${MONTHS[+m[2] - 1]}` : '';
  }
  function fmtTime(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const now = new Date();
    const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'сегодня в ' + hm;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'вчера в ' + hm;
    return `${d.getDate()} ${MONTHS[d.getMonth()]} в ${hm}`;
  }
  function autosize(el) {
    const fit = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };
    el.addEventListener('input', fit);
    requestAnimationFrame(fit);
    return el;
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  // ---------- сравнение версий письма (по словам) ----------
  function diffTokens(a, b) {
    let start = 0;
    while (start < a.length && start < b.length && a[start] === b[start]) start++;
    let endA = a.length, endB = b.length;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
    const A = a.slice(start, endA), B = b.slice(start, endB);
    const n = A.length, m = B.length;
    if (n * m > 4e6) return null;
    const W = m + 1;
    const dp = new Uint16Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i * W + j] = A[i] === B[j] ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
    const ops = [];
    const push = (t, s) => { const last = ops[ops.length - 1]; if (last && last.t === t) last.s += s; else ops.push({ t, s }); };
    if (start) push('=', a.slice(0, start).join(''));
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { push('=', A[i]); i++; j++; }
      else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { push('-', A[i]); i++; }
      else { push('+', B[j]); j++; }
    }
    while (i < n) push('-', A[i++]);
    while (j < m) push('+', B[j++]);
    if (endA < a.length) push('=', a.slice(endA).join(''));
    return ops;
  }
  function renderDiff(oldText, newText) {
    const tok = (s) => s.match(/\s+|[^\s]+/g) || [];
    const ops = diffTokens(tok(oldText), tok(newText));
    const box = h('div', { class: 'ds-letter' });
    if (!ops) { box.textContent = newText; return box; }
    for (const op of ops) {
      if (op.t === '=') { box.append(op.s); continue; }
      // Пробелы и переносы по краям — вне подсветки; удалённые пробелы не показываем
      const [, lead, core, trail] = /^(\s*)([\s\S]*?)(\s*)$/.exec(op.s);
      if (op.t === '+') box.append(lead);
      if (core) box.append(h(op.t === '+' ? 'mark' : 'del', { class: op.t === '+' ? 'ds-diff-add' : 'ds-diff-del' }, core));
      if (op.t === '+') box.append(trail);
    }
    return box;
  }

  // ---------- состояние ----------
  // view: 'home' (список эвентов) или 'event' (вкладки одного эвента).
  // nav — номер экрана (009): растёт при каждом переходе; ответ сервера для прежнего экрана не рисуется.
  // drafts[evId] — несохранённые объявление и параметры эвента (переживают перерисовку панели).
  // wardCache — последний ответ ward.get: после закрытия переписки «Подопечный» перерисовывается без нового запроса,
  // иначе подсветка изменений письма пропала бы (сервер считает письмо просмотренным).
  const state = {
    me: null, events: [], limits: { chars: 4000 }, view: 'home', nav: 0, drafts: {}, wardCache: null,
    evId: null, ev: null, member: null, can: {}, tab: 'my', dirty: false, wardNameShown: false,
    support: null, supportAdmin: null, // 012: обращения — участнику его статус, админу — ничьи и непрочитанные
  };
  const main = document.getElementById('main');
  const heroTitle = document.getElementById('heroTitle');
  const heroSub = document.getElementById('heroSub');
  const heroBack = document.getElementById('heroBack');
  const UNSAVED = 'Письмо или адрес не сохранены. Уйти без сохранения?';
  async function leaveEvent() {
    if (state.dirty && !(await confirmBox(UNSAVED))) return;
    setDirty(false);
    await goHome();
  }
  heroBack.addEventListener('click', leaveEvent);

  // Запросы в пределах открытого эвента
  const eapi = (action, body) => api(action, { ...(body || {}), event: state.evId });
  const finished = () => state.ev && state.ev.status === 'finished';

  function setDirty(v) {
    state.dirty = v;
    try { if (tg && ver('6.2')) v ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {}
    if (state.view === 'event') renderTabs();
  }

  async function reloadMe() {
    const d = await api('me');
    if (!d.registered) return d;
    state.me = d.me;
    state.events = d.events;
    state.limits = d.limits;
    return d;
  }

  // Данные эвента evId; если пользователь уже в другом эвенте — ничего не меняет (009).
  // Участие обновляется на месте: открытые экраны держат ссылку на state.member и видят свежие данные.
  async function reloadEvent(evId = state.evId) {
    const d = await api('event.get', { event: evId });
    if (evId !== state.evId) return null;
    if (state.member && d.member && state.ev && state.ev.id === d.event.id) Object.assign(state.member, d.member);
    else state.member = d.member;
    state.ev = d.event;
    state.can = d.can;
    state.announcements = d.announcements || [];
    state.support = d.support || null;
    state.supportAdmin = d.support_admin || null;
    return d;
  }

  function showLoader() { main.replaceChildren(h('div', { class: 'ds-loader' }, h('div', { class: 'ds-spinner' }), 'Загрузка…')); }
  // retry — повтор именно неудавшейся загрузки (009); на экране эвента — ещё выход к списку
  function showError(e, retry) {
    const again = h('button', { class: 'ds-btn ds-btn--secondary ds-empty__action', onclick: () => (retry || render)() }, 'Попробовать снова');
    const home = state.view === 'event' && state.me
      ? h('button', { class: 'ds-btn ds-btn--secondary ds-empty__action', onclick: () => { setDirty(false); goHome(); } }, 'К списку событий')
      : null;
    main.replaceChildren(ui.empty('⚠️', 'Не получилось загрузить', e.message, [again, home]));
  }

  function render() {
    state.nav++;
    window.scrollTo(0, 0);
    if (state.view === 'home') renderHome();
    else {
      renderHero();
      renderTabs();
      ({ my: renderMy, ward: renderWard, info: renderInfo, admin: renderAdmin }[state.tab] || renderInfo)();
    }
    syncBack();
  }

  // ---------- главный экран: список эвентов (005) ----------
  async function goHome() {
    const nav = ++state.nav;
    state.view = 'home';
    state.evId = null;
    state.ev = null;
    state.wardCache = null;
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
    syncBack();
    showLoader();
    try { await reloadMe(); } catch (e) { if (nav === state.nav) showError(e, goHome); return; }
    if (nav === state.nav) render();
  }

  async function openEvent(id, tab, chat, support) {
    const nav = ++state.nav;
    state.view = 'event';
    state.evId = id;
    state.member = null;
    state.wardCache = null;
    state.wardNameShown = false;
    syncBack();
    showLoader();
    try { await reloadEvent(id); } catch (e) { if (nav === state.nav) showError(e, () => openEvent(id, tab, chat, support)); return; }
    if (nav !== state.nav) return;
    const m = state.member;
    // Админу «Подопечный» по умолчанию не открывается: просмотр подопечного запрещает отмену жеребьёвки (009)
    // 012: из кнопок бота «💬 Открыть» — обращение участника (support=my) или обращение в панели админа (support=<id>)
    const supportThread = state.me.is_admin && /^\d+$/.test(support || '') ? Number(support) : 0;
    if (support === 'my' && m) tab = 'info';
    if (supportThread) tab = 'admin';
    state.tab = tab || (state.me.is_admin ? (m ? 'my' : 'admin')
      : m ? (state.ev.draw_done && m.has_ward && m.wishlist.trim() ? 'ward' : 'my') : 'info');
    render();
    if (chat === 'santa' && m && m.has_santa) openChat('santa');
    if (chat === 'ward' && m && m.has_ward) openChat('ward');
    if (support === 'my' && m) openSupport();
    if (supportThread) openSupportThread(supportThread, id, () => (state.evId === id && state.tab === 'admin' ? render() : undefined));
  }

  // Системная кнопка «Назад» Telegram (009): закрывает шторку, на экране эвента — возврат к списку
  function syncBack() {
    try {
      if (!tg || !ver('6.1')) return;
      if (sheetEl || (state.view === 'event' && !heroBack.hidden)) tg.BackButton.show();
      else tg.BackButton.hide();
    } catch (e) {}
  }
  try { if (tg && ver('6.1')) tg.BackButton.onClick(() => (sheetEl ? requestCloseSheet() : state.view === 'event' ? leaveEvent() : null)); } catch (e) {}

  function eventRow(e) {
    const chips = [e.status === 'finished' ? ui.chip('завершён') : ui.chip('идёт', 'success')];
    if (e.event_date) chips.push(ui.chip('🎁 ' + fmtDate(e.event_date)));
    if (!e.member) chips.push(ui.chip('ты не участвуешь'));
    return h('div', { class: 'ds-list-item ds-list-item--link', role: 'button', onclick: () => openEvent(e.id) },
      h('div', { class: 'ds-grow' }, h('div', { class: 'ds-list-item__title' }, e.title), h('div', { class: 'ds-chips' }, chips)),
      e.unread ? h('span', { class: 'ds-badge' }, String(e.unread)) : null,
      h('span', { class: 'ds-list-item__chevron' }, '›'));
  }

  function renderHome() {
    const me = state.me;
    heroBack.hidden = true;
    heroTitle.textContent = 'Тайный Санта';
    heroSub.textContent = 'Привет, ' + me.name + '!';
    document.getElementById('tabs').hidden = true;
    const mine = state.events.filter((e) => e.member);
    const others = state.events.filter((e) => !e.member);
    const nodes = [];
    nodes.push(ui.section('Мои события'));
    if (mine.length) nodes.push(h('div', { class: 'ds-card ds-card--flush' }, mine.map(eventRow)));
    else nodes.push(ui.hint(me.is_admin
      ? 'Ты пока не участвуешь ни в одном событии. Создай событие или вступи в существующее («Админ» → «Я участвую»).'
      : 'Ты пока не участвуешь ни в одном событии. Попроси у организатора пригласительную ссылку.', 'ds-hint--inset'));

    if (me.is_admin) {
      if (others.length) nodes.push(ui.section('Другие события'), h('div', { class: 'ds-card ds-card--flush' }, others.map(eventRow)));
      const create = ui.btn('🎄 Создать', 'festive', 'ds-btn--block');
      create.addEventListener('click', () => {
        const title = h('input', { class: 'ds-input', type: 'text', maxlength: 80, placeholder: 'Например: Новый год 2026 — семья' });
        // Образец (007): параметры и исключения прошлого эвента, по желанию — приглашение его участников
        const from = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Без образца — с чистого листа'),
          ...state.events.map((e) => h('option', { value: e.id }, 'По образцу: ' + e.title)));
        const invite = h('input', { type: 'checkbox', checked: true, disabled: true });
        const inviteRow = h('label', { class: 'ds-check' }, invite, 'Пригласить участников образца');
        from.addEventListener('change', () => { invite.disabled = !from.value; });
        const ok = ui.btn('Создать', '', 'ds-btn--block');
        ok.addEventListener('click', () => busy(ok, async () => {
          if (!title.value.trim()) return toast('Напиши название');
          const r = await api('admin.events.create', { title: title.value, from: from.value ? +from.value : undefined, invite: !!from.value && invite.checked });
          closeSheet();
          toast(r.invited ? `🎄 Событие создано, приглашения: ${r.invited}` : r.invite_error ? '🎄 Событие создано. ' + r.invite_error : '🎄 Событие создано');
          await reloadMe();
          await openEvent(r.event.id, 'admin');
        }));
        const sheet = [ui.hint('У события будут свои участники, пригласительная ссылка, письма и жеребьёвка. Можно вести несколько событий одновременно.'), title];
        if (state.events.length) {
          sheet.push(from, inviteRow, ui.hint('Из образца копируются бюджет, место, заметки, правила жеребьёвки и исключения. Даты — нет.'));
        }
        openSheet('Новое событие', [...sheet, ok]);
      });
      nodes.push(h('div', { class: 'ds-card' }, create));
      nodes.push(...renderFamiliesSection());
      nodes.push(...renderAdminsSection());
    }

    // Уведомления — общие для всех эвентов
    const modes = [['sound', '🔔 Звук'], ['silent', '🔕 Тихо'], ['off', '🚫 Выкл']];
    const seg = h('div', { class: 'ds-segmented' });
    const draw = () => seg.replaceChildren(...modes.map(([k, label]) => h('button', {
      class: 'ds-segmented__item' + (me.notify_mode === k ? ' ds-segmented__item--on' : ''),
      onclick: () => busy(null, async () => { await api('notify.set', { mode: k }); me.notify_mode = k; draw(); toast('Сохранено'); }),
    }, label)));
    draw();
    nodes.push(ui.section('Уведомления'),
      ui.card(ui.hint('Когда подопечный меняет письмо (в любом событии), бот сообщит об этом — без имени и подробностей.'), seg));
    main.replaceChildren(...nodes);
  }

  // Раздел «Семьи» (008): постоянные исключения для всех эвентов
  function renderFamiliesSection() {
    const box = h('div', {}, ui.section('Семьи'), h('div', { class: 'ds-loader' }, h('div', { class: 'ds-spinner' })));
    const load = () => api('admin.families').then((d) => {
      const list = h('div', { class: 'ds-card ds-card--flush' });
      if (!d.families.length) list.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Семей пока нет.'));
      for (const f of d.families) {
        list.append(h('div', { class: 'ds-list-item' },
          h('div', { class: 'ds-grow' }, h('div', { class: 'ds-list-item__title' }, f.name), ui.hint(f.members.map((m) => m.name).join(', '))),
          h('button', { class: 'ds-icon-btn', title: 'Изменить семью', onclick: () => openFamily(d, f) }, '✏️')));
      }
      const add = ui.btn('Новая семья', 'secondary', 'ds-btn--block');
      add.addEventListener('click', () => openFamily(d, null));
      box.replaceChildren(ui.section('Семьи'), list,
        ui.card(ui.hint('Члены одной семьи не дарят друг другу ни в одном событии (если в событии включено «Учитывать семьи»). Один человек — одна семья.'), add));
    }).catch((e) => box.replaceChildren(ui.section('Семьи'), ui.hint('⚠️ ' + e.message, 'ds-hint--inset')));
    function openFamily(d, f) {
      const name = h('input', { class: 'ds-input', type: 'text', maxlength: 40, value: f ? f.name : '', placeholder: 'Например: Ивановы' });
      const free = d.users.filter((u) => !u.family_id || (f && u.family_id === f.id));
      const boxes = free.map((u) => {
        const c = h('input', { type: 'checkbox', checked: !!f && u.family_id === f.id });
        c.dataset.id = u.id;
        return [c, h('label', { class: 'ds-check' }, c, u.name)];
      });
      const save = ui.btn('Сохранить', '', 'ds-btn--block');
      save.addEventListener('click', () => busy(save, async () => {
        const members = boxes.filter(([c]) => c.checked).map(([c]) => +c.dataset.id);
        await api('admin.family.save', { id: f ? f.id : undefined, name: name.value, members });
        closeSheet();
        toast('Семья сохранена');
        await load();
      }));
      const items = [name, ui.hint('Кто в семье (люди из других семей здесь не показаны):'), ...boxes.map(([, l]) => l), save];
      if (f) {
        const del = ui.btn('🗑 Удалить семью', 'danger', 'ds-btn--block');
        del.addEventListener('click', async () => {
          if (!(await confirmBox(`Удалить семью «${f.name}»? Уже проведённые жеребьёвки не изменятся.`))) return;
          busy(del, async () => { await api('admin.family.delete', { id: f.id }); closeSheet(); toast('Семья удалена'); await load(); });
        });
        items.push(del);
      }
      openSheet(f ? 'Семья' : 'Новая семья', items);
    }
    load();
    return [box];
  }

  // Раздел «Администраторы» (002): общий для бота, показывается на главном экране
  function renderAdminsSection() {
    const box = h('div', {}, ui.section('Администраторы'), h('div', { class: 'ds-loader' }, h('div', { class: 'ds-spinner' })));
    api('admin.users').then((d) => {
      const me = state.me;
      const admins = d.users.filter((u) => u.is_admin).sort((a, b) => (b.is_owner ? 1 : 0) - (a.is_owner ? 1 : 0));
      const list = h('div', { class: 'ds-card ds-card--flush' });
      for (const u of admins) {
        const actions = h('div', { class: 'ds-row ds-row--tight' });
        if (me.is_owner && !u.is_owner) {
          actions.append(
            h('button', { class: 'ds-icon-btn', title: 'Передать права владельца', onclick: async () => {
              if (!(await confirmBox(`Передать права владельца «${u.name}»? Ты останешься администратором, но назначать и снимать админов сможет только новый владелец.`))) return;
              busy(null, async () => { await api('admin.owner.transfer', { id: u.id }); toast('👑 Права владельца переданы'); await goHome(); });
            } }, '👑'),
            h('button', { class: 'ds-icon-btn', title: 'Снять права администратора', onclick: async () => {
              if (!(await confirmBox(`Снять права администратора с «${u.name}»?`))) return;
              busy(null, async () => { await api('admin.role.revoke', { id: u.id }); toast('Права администратора сняты'); await goHome(); });
            } }, '✕'));
        }
        list.append(h('div', { class: 'ds-list-item' },
          h('div', { class: 'ds-grow' },
            h('div', { class: 'ds-list-item__title' }, u.name || 'без имени', u.id === me.id ? h('span', { class: 'ds-hint ds-text-regular' }, '  (ты)') : null),
            h('div', { class: 'ds-chips' }, u.is_owner ? ui.chip('👑 владелец') : ui.chip('🛠 админ'))),
          actions));
      }
      const parts = [ui.section('Администраторы'), list];
      if (me.is_owner) {
        const candidates = d.users.filter((u) => !u.is_admin);
        if (candidates.length) {
          const sel = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Кого назначить…'), ...candidates.map((u) => h('option', { value: u.id }, u.name)));
          const grant = ui.btn('🛠 Назначить админом', 'secondary', 'ds-btn--block');
          grant.addEventListener('click', async () => {
            const u = candidates.find((x) => String(x.id) === sel.value);
            if (!u) return toast('Выбери человека');
            if (!(await confirmBox(`Назначить «${u.name}» администратором? Он(а) сможет создавать и вести события. Кто кому дарит, админы не видят.`))) return;
            busy(grant, async () => { await api('admin.role.grant', { id: u.id }); toast('Администратор назначен'); await goHome(); });
          });
          parts.push(ui.card(ui.hint('Админы создают и ведут события. Назначать, снимать админов и передавать права владельца (👑) можешь только ты.'), sel, grant));
        }
      } else {
        parts.push(ui.hint(`Назначать и снимать администраторов может только владелец${d.owner_name ? ' — ' + d.owner_name : ''}.`, 'ds-hint--inset'));
      }
      const log = ui.btn('📜 Журнал действий', 'secondary', 'ds-btn--block');
      log.addEventListener('click', () => openAudit(null));
      parts.push(ui.card(ui.hint('Роли, перенос участия, удалённые события — кто и когда.'), log));
      box.replaceChildren(...parts);
    }).catch((e) => box.replaceChildren(ui.section('Администраторы'), ui.hint('⚠️ ' + e.message, 'ds-hint--inset')));
    return [box];
  }

  // ---------- экран эвента ----------
  function renderHero() {
    const e = state.ev;
    heroBack.hidden = !(state.events.length > 1 || state.me.is_admin);
    heroTitle.textContent = e.title;
    const parts = [];
    if (e.status === 'finished') parts.push('🏁 завершён');
    if (e.event_date) parts.push('🎁 ' + fmtDate(e.event_date));
    if (e.budget) parts.push('💰 ' + e.budget);
    // неразрывные пробелы внутри частей: «до 50 BYN» не разрывается на две строки
    heroSub.textContent = parts.map((p) => p.replace(/ /g, '\u00a0')).join(' · ') || 'Тайный Санта';
  }

  function tabHasDot(id) {
    const u = (state.member && state.member.unread) || {};
    if (id === 'my') return state.dirty || u.from_santa > 0;
    if (id === 'ward') return u.from_ward > 0;
    // 012: непрочитанный ответ организатора; у админа — ничьи обращения и новые сообщения во взятых им
    if (id === 'info') return !!(state.support && state.support.unread > 0);
    if (id === 'admin') return !!(state.supportAdmin && state.supportAdmin.waiting + state.supportAdmin.unread > 0);
    return false;
  }

  function tabsList() {
    const t = [];
    if (state.member) t.push(['my', '✉️', 'Письмо'], ['ward', '🎁', 'Подопечный']);
    t.push(['info', 'ℹ️', 'Инфо']);
    if (state.me.is_admin) t.push(['admin', '🛠', 'Админ']);
    return t;
  }

  function renderTabs() {
    const nav = document.getElementById('tabs');
    nav.hidden = false;
    nav.replaceChildren(...tabsList().map(([id, icon, label]) =>
      h('button', {
        class: 'ds-tab' + (state.tab === id ? ' ds-tab--active' : ''),
        onclick: async () => {
          if (state.tab === id) return;
          if (state.dirty && !(await confirmBox(UNSAVED))) return;
          if (state.dirty) setDirty(false);
          state.tab = id;
          render();
        },
      }, h('span', { class: 'ds-tab__icon' }, icon), h('span', { class: 'ds-tab__label' }, label),
        tabHasDot(id) ? h('span', { class: 'ds-tab__dot' }) : null)
    ));
  }

  // Плашка завершённого эвента
  function finishedNotice() {
    if (!finished()) return null;
    const e = state.ev;
    const until = new Date(e.chat_until);
    const chat = state.can.chat_write
      ? `Переписка открыта до ${until.getDate()} ${MONTHS[until.getMonth()]}, потом — только чтение.`
      : 'Переписка — только для чтения.';
    return h('div', { class: 'ds-notice ds-text-sm' }, `🏁 Событие завершено ${fmtTime(e.finished_at)}. Письмо и отметки — только для чтения. ${chat}`);
  }

  // Кнопка «💬 Написать …» с числом непрочитанных
  function chatButton(withWhom) {
    const n = ((state.member && state.member.unread) || {})[withWhom === 'ward' ? 'from_ward' : 'from_santa'] || 0;
    const label = state.can.chat_write
      ? (withWhom === 'ward' ? '💬 Написать подопечному' : '💬 Написать Санте')
      : (withWhom === 'ward' ? '💬 Переписка с подопечным' : '💬 Переписка с Сантой');
    const btn = ui.btn(label, 'secondary', 'ds-btn--block');
    if (n) btn.append(h('span', { class: 'ds-badge' }, String(n)));
    btn.addEventListener('click', () => openChat(withWhom));
    return btn;
  }

  // ---------- вкладка «Письмо» ----------
  function renderMy() {
    const m = state.member;
    const max = state.limits.chars;
    const nodes = [finishedNotice(), ui.section('Письмо Тайному Санте')];
    // «Несохранённое» — письмо или адрес (009)
    let letterChanged = false, addrChanged = false;
    const recompute = () => { const v = letterChanged || addrChanged; if (v !== state.dirty) setDirty(v); };
    if (!state.can.edit_letter) {
      nodes.push(ui.card(
        m.wishlist.trim() ? h('div', { class: 'ds-letter' }, m.wishlist) : h('div', { class: 'ds-text-muted' }, 'Письмо осталось пустым.'),
        m.wishlist_updated_at ? ui.hint('Последнее изменение ' + fmtTime(m.wishlist_updated_at)) : null));
    } else {
      const ta = ui.textarea({
        class: 'ds-input ds-input--letter',
        placeholder: 'Дорогой Санта! В этом году я мечтаю о…\n\nНапиши, что хочешь получить, что любишь, размеры одежды, любимые цвета — и чего точно не надо.',
        value: m.wishlist,
      });
      const counter = h('span', { class: 'ds-counter' });
      const saveBtn = ui.btn('Сохранить', '', 'ds-btn--block');
      const status = h('span', { class: 'ds-hint' });
      const update = () => {
        const n = ta.value.length;
        counter.textContent = `${n} / ${max} символов`;
        counter.classList.toggle('ds-counter--over', n > max);
        const changed = ta.value !== m.wishlist;
        saveBtn.disabled = !changed || n > max;
        letterChanged = changed;
        recompute();
        status.textContent = changed ? 'Есть несохранённые изменения' : m.wishlist_updated_at ? 'Сохранено ' + fmtTime(m.wishlist_updated_at) : '';
      };
      ta.addEventListener('input', update);
      // Сохранённым считается только отправленный текст: допечатанное во время запроса остаётся несохранённым (009)
      saveBtn.addEventListener('click', () => busy(saveBtn, async () => {
        const text = ta.value;
        const r = await eapi('wishlist.save', { text });
        m.wishlist = text;
        m.wishlist_updated_at = r.updated_at;
        haptic('success');
        toast(m.has_santa ? '✅ Сохранено. Если у Санты включены уведомления, он узнает об этом через несколько минут' : '✅ Письмо сохранено');
      }).then(update));
      nodes.push(ui.card(
        ui.hint(`Письмо увидит твой Санта в этом событии; организатор может открыть его — это записывается в журнал. Менять можно, пока событие идёт. До ${max} символов — столько помещается в одно сообщение Telegram.`),
        ta, h('div', { class: 'ds-row ds-row--between' }, counter, status), saveBtn));
      requestAnimationFrame(update);
    }
    // 008: адрес доставки — увидит только Санта
    if (state.ev.delivery_on) {
      nodes.push(ui.section('Как передать подарок'));
      if (!state.can.edit_letter) {
        nodes.push(ui.card(m.delivery ? h('div', { class: 'ds-letter' }, m.delivery) : h('div', { class: 'ds-text-muted' }, 'Адрес не указан.')));
      } else {
        const addr = ui.textarea({ placeholder: 'Город, отделение почты или адрес, получатель, телефон — или «заберу сам(а)»', rows: 2, maxlength: 500, value: m.delivery });
        const saveAddr = ui.btn('Сохранить адрес', 'secondary', 'ds-btn--block');
        const updateAddr = () => {
          addrChanged = addr.value.trim() !== (m.delivery || '');
          saveAddr.disabled = !addrChanged;
          recompute();
        };
        addr.addEventListener('input', updateAddr);
        saveAddr.addEventListener('click', () => busy(saveAddr, async () => {
          const text = addr.value;
          await eapi('delivery.save', { text });
          m.delivery = text.trim();
          haptic('success');
          toast('📍 Адрес сохранён');
        }).then(updateAddr));
        requestAnimationFrame(updateAddr);
        nodes.push(ui.card(ui.hint('Подарки в этом событии отправляют. Адрес увидит только твой Санта — организатор его не видит.'), addr, saveAddr));
      }
    }
    if (m.has_santa) {
      // 007: подопечный отмечает «получил подарок»; Санта узнает об этом (без имени)
      const got = h('input', { type: 'checkbox', checked: m.gift_received, disabled: !state.can.edit_letter });
      const evId = state.evId;
      bindToggle(got, async (on) => {
        await api('ward.received', { event: evId, received: on });
        m.gift_received = on;
        haptic('success');
        toast(on ? '🎉 Спасибо! Санта узнает, что подарок дошёл' : 'Отметка снята');
      });
      nodes.push(h('div', { class: 'ds-card' }, ui.toggleRow('🎁 Я получил(а) подарок', 'Твой Санта узнает, что подарок дошёл', got)));
      nodes.push(ui.section('Переписка с Сантой'),
        ui.card(ui.hint('Хочешь что-то уточнить или ответить на вопрос? Напиши своему Тайному Санте. Ты не знаешь, кто он, а он знает тебя.'), chatButton('santa')));
    }
    main.replaceChildren(...nodes.filter(Boolean));
  }

  // ---------- вкладка «Подопечный» ----------
  // cached — перерисовать по последнему ответу (после закрытия переписки), не запрашивая ward.get заново
  async function renderWard({ cached = false } = {}) {
    const nav = state.nav, evId = state.evId;
    let d = cached && state.wardCache && state.wardCache.evId === evId ? state.wardCache.d : null;
    if (!d) {
      showLoader();
      try { d = await api('ward.get', { event: evId }); } catch (e) { if (nav === state.nav) showError(e); return; }
      if (nav !== state.nav) return;
      state.wardCache = { evId, d };
    }
    if (d.state !== 'ok') {
      main.replaceChildren(...[finishedNotice(), d.state === 'no_draw'
        ? ui.empty('🎲', 'Жеребьёвка ещё не проведена', 'Как только организатор её проведёт, здесь появится имя и письмо твоего подопечного. Бот пришлёт уведомление.')
        : ui.empty('⏳', 'Скоро тебя добавят', 'Ты присоединился после жеребьёвки. Организатор впишет тебя — и бот пришлёт уведомление.')].filter(Boolean));
      return;
    }
    const nameEl = h('div', { class: 'ds-ward-card__name' + (state.wardNameShown ? '' : ' ds-ward-card__name--hidden') }, d.ward.name);
    const toggle = ui.btn(state.wardNameShown ? '🙈 Скрыть' : '👀 Показать имя', 'sm', 'ds-btn--on-festive');
    toggle.addEventListener('click', () => {
      state.wardNameShown = !state.wardNameShown;
      nameEl.classList.toggle('ds-ward-card__name--hidden', !state.wardNameShown);
      toggle.textContent = state.wardNameShown ? '🙈 Скрыть' : '👀 Показать имя';
    });

    const text = d.ward.wishlist || '';
    let letter;
    if (!text.trim()) {
      letter = h('div', { class: 'ds-text-muted' }, finished() ? 'Подопечный так и не написал письмо.' : 'Подопечный пока ничего не написал. Можно спросить его в переписке — кнопка ниже 👇');
    } else if (d.previous !== null && d.previous !== undefined) {
      letter = h('div', { class: 'ds-stack' },
        h('div', { class: 'ds-notice ds-text-sm' }, '✨ Письмо изменилось с твоего прошлого просмотра: новое ',
          h('mark', { class: 'ds-diff-add' }, 'выделено'), ', удалённое ', h('del', { class: 'ds-diff-del' }, 'зачёркнуто'), '.'),
        renderDiff(d.previous, text));
    } else {
      letter = h('div', { class: 'ds-letter' }, text);
    }

    const gift = h('input', { type: 'checkbox', checked: d.gift_ready, disabled: finished() });
    bindToggle(gift, async (on) => {
      await api('ward.gift', { event: evId, ready: on });
      d.gift_ready = on;
      haptic('success');
      toast(on ? '🎉 Отлично! Подарок отмечен как готовый' : 'Отметка снята');
    });

    main.replaceChildren(...[
      finishedNotice(),
      h('div', { class: 'ds-ward-card' }, h('div', { class: 'ds-ward-card__label' }, finished() ? 'Ты был(а) Тайным Сантой для' : 'Ты — Тайный Санта для'), nameEl, toggle),
      ui.section('Письмо подопечного'),
      ui.card(letter, d.ward.updated_at && text.trim() ? ui.hint('Обновлено ' + fmtTime(d.ward.updated_at)) : null),
      d.ward.delivery !== undefined ? ui.section('Как передать подарок') : null,
      d.ward.delivery !== undefined
        ? ui.card(d.ward.delivery ? h('div', { class: 'ds-letter' }, d.ward.delivery) : h('div', { class: 'ds-text-muted' }, 'Подопечный пока не указал адрес — спроси в переписке.'))
        : null,
      h('div', { class: 'ds-card' }, ui.toggleRow('🎁 Подарок готов', 'Видно только организатору — для статистики', gift)),
      ui.section('Переписка с подопечным'),
      ui.card(ui.hint('Есть вопрос? Напиши подопечному — для него ты «Тайный Санта», имя не раскрывается.'), chatButton('ward')),
    ].filter(Boolean));
  }

  // ---------- вкладка «Инфо» ----------
  function renderInfo() {
    const g = state.ev;
    const rows = [];
    rows.push(['Статус', g.status === 'finished' ? 'завершён 🏁' : 'идёт']);
    if (g.budget) rows.push(['Бюджет', g.budget]);
    if (g.event_date) rows.push(['Вручение', fmtDate(g.event_date)]);
    if (g.place) rows.push(['Где', g.place]);
    if (g.deadline) rows.push(['Письмо до', fmtDate(g.deadline)]);
    rows.push(['Участников', String(g.participants)]);
    rows.push(['Жеребьёвка', g.draw_done ? 'проведена ✅' : 'ещё не проведена']);
    rows.push(['Кольцевая', g.ring ? 'да — взаимных пар нет' : 'нет — взаимные пары возможны']);
    const nodes = [
      finishedNotice(),
      ui.section('О событии'),
      h('div', { class: 'ds-card' }, h('dl', { class: 'ds-info-grid' }, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))),
    ];
    if (g.notes) nodes.push(h('div', { class: 'ds-card ds-letter' }, g.notes));
    if (state.announcements.length) {
      nodes.push(ui.section('Объявления'), ...state.announcements.map((a) => ui.card(
        h('div', { class: 'ds-letter' }, a.text),
        ui.hint(`📣 ${a.author_name} · ${fmtTime(a.created_at)}`))));
    }
    // 012: обращение к организатору — участнику эвента, если есть кому написать
    const sup = state.support;
    if (state.member && sup && (sup.available || sup.open || sup.unread)) {
      const btn = ui.btn(state.can.chat_write ? '💬 Написать организатору' : '💬 Обращения к организатору', 'secondary', 'ds-btn--block');
      if (sup.unread) btn.append(h('span', { class: 'ds-badge' }, String(sup.unread)));
      btn.addEventListener('click', () => openSupport());
      const status = sup.open ? (sup.assignee_name ? `Твоё обращение ведёт ${sup.assignee_name}.` : 'Обращение отправлено — ждёт ответа организатора.') : '';
      nodes.push(ui.section('Нужна помощь?'), ui.card(
        ui.hint('Вопрос по игре или что-то не работает? Напиши организатору — ответ придёт в чат бота и сюда. Не пиши, кто твой подопечный: организаторы не должны знать пары.'),
        status ? h('div', { class: 'ds-text-sm' }, status) : null,
        btn));
    }
    if (!state.member) nodes.push(ui.hint('Ты не участвуешь в этом событии — тебе доступна только информация и панель организатора.', 'ds-hint--inset'));
    nodes.push(
      ui.section('Как это работает'),
      h('div', { class: 'ds-card' }, h('ul', { class: 'ds-bullets' },
        h('li', {}, 'Напиши письмо Санте — его увидит тот, кто будет дарить тебе подарок.'),
        h('li', {}, 'После жеребьёвки во вкладке «Подопечный» появится, кому даришь ты.'),
        h('li', {}, 'После завершения события письмо остаётся для чтения, переписка открыта ещё 7 дней. Событие сохранится в истории.'))));
    main.replaceChildren(...nodes.filter(Boolean));
  }

  // ---------- вкладка «Админ» ----------
  async function renderAdmin() {
    // Экран строится для эвента evId (009): все действия — над ним; ответ для покинутого экрана не рисуется
    const nav = state.nav, evId = state.evId;
    const live = () => nav === state.nav;
    const xapi = (action, body) => api(action, { ...(body || {}), event: evId });
    const again = () => (live() ? renderAdmin() : undefined);
    showLoader();
    let d;
    try { d = await xapi('admin.state'); } catch (e) { if (live()) showError(e); return; }
    if (!live()) return;
    const s = d.settings;
    const users = d.users;
    const byId = Object.fromEntries(users.map((u) => [u.id, u]));
    const players = users.filter((u) => u.registered);
    const me = state.me;
    const done = s.status === 'finished';
    const drafts = state.drafts[evId] || (state.drafts[evId] = {});
    const refresh = async () => {
      if (!live()) return;
      await reloadMe().catch(() => {});
      await reloadEvent(evId).catch(() => {});
      if (!live()) return;
      renderHero();
      if (!state.member && (state.tab === 'my' || state.tab === 'ward')) state.tab = 'admin';
      renderTabs();
      syncBack();
      await again();
    };
    const nodes = [finishedNotice()];

    // --- обращения участников (012): без текстов; переписка — в шторке обращения
    const supportNodes = () => {
      const sup = d.support || { threads: [] };
      const openCount = sup.threads.filter((t) => t.status === 'open').length;
      const list = h('div', { class: 'ds-card ds-card--flush' });
      if (!sup.threads.length) list.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Обращений пока нет.'));
      for (const t of sup.threads) {
        const chip = t.status !== 'open' ? ui.chip('✅ закрыто')
          : !t.assignee ? ui.chip('🆕 ждёт ответа', 'warning')
          : t.assignee === me.id ? ui.chip('🙋 ведёшь ты', 'success') : ui.chip('🙋 ведёт ' + t.assignee_name);
        list.append(h('div', { class: 'ds-list-item ds-list-item--link', role: 'button', onclick: () => openSupportThread(t.id, evId, again) },
          h('div', { class: 'ds-grow' },
            h('div', { class: 'ds-list-item__title' }, t.name || 'без имени'),
            h('div', { class: 'ds-chips' }, chip),
            ui.hint(fmtTime(t.last_at))),
          t.unread ? h('span', { class: 'ds-badge' }, String(t.unread)) : null,
          h('span', { class: 'ds-list-item__chevron' }, '›')));
      }
      return [
        ui.section(openCount ? `Обращения · ${openCount}` : 'Обращения'),
        ui.hint('Участники пишут организатору из вкладки «Инфо». Переписку взятого обращения видят тот, кто его ведёт, и владелец.', 'ds-hint--inset'),
        list,
      ];
    };

    // --- приглашение (только для идущего эвента)
    if (!done) {
      const regToggle = h('input', { type: 'checkbox', checked: s.registration_open });
      bindToggle(regToggle, async (on) => {
        await xapi('admin.registration', { open: on });
        toast(on ? 'Регистрация открыта' : 'Регистрация закрыта');
      });
      const linkInput = h('input', { class: 'ds-input', type: 'text', value: s.invite_link || 'Ссылки ещё нет: владелец бота должен один раз открыть /setup (см. README)', readonly: true });
      const copyBtn = ui.btn('📋 Копировать', 'secondary', 'ds-btn--sm');
      const shareBtn = ui.btn('📤 Отправить в чат', 'secondary', 'ds-btn--sm');
      // Без ссылки копировать и пересылать нечего (009)
      copyBtn.disabled = shareBtn.disabled = !s.invite_link;
      copyBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(s.invite_link); toast('Ссылка скопирована'); }
        catch (e) { linkInput.select(); toast('Выдели и скопируй ссылку'); }
      });
      shareBtn.addEventListener('click', () => {
        const url = 'https://t.me/share/url?url=' + encodeURIComponent(s.invite_link) + '&text=' + encodeURIComponent(`🎄 Играем в Тайного Санту — «${s.title}»! Заходи по ссылке:`);
        if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
      });
      const regenBtn = ui.btn('🔄 Новая ссылка', 'danger', 'ds-btn--sm');
      regenBtn.addEventListener('click', async () => {
        if (!(await confirmBox('Создать новую ссылку? Старая перестанет работать (уже вступивших это не затронет).'))) return;
        busy(regenBtn, async () => { await xapi('admin.invite.regen'); toast('Ссылка обновлена'); await again(); });
      });
      // 010: возврат удалённых организатором по ссылке
      const rejoinToggle = h('input', { type: 'checkbox', checked: s.rejoin });
      bindToggle(rejoinToggle, async (on) => {
        await xapi('admin.game', { rejoin: on });
        toast(on ? 'Удалённые могут вернуться по ссылке' : 'Удалённые не вернутся по ссылке');
        await again();
      });
      // 008: вступление по одобрению
      const apprToggle = h('input', { type: 'checkbox', checked: s.approval });
      bindToggle(apprToggle, async (on) => {
        await xapi('admin.game', { approval: on });
        toast(on ? 'Новые участники — по заявке' : 'Вступление без одобрения');
      });
      const regCard = ui.card(
        ui.toggleRow('Регистрация открыта', 'Закрыта — новых участников нет: ни по ссылке, ни по заявке, ни по приглашению (кроме «Я участвую»). Закрывается сама после жеребьёвки.', regToggle),
        linkInput,
        h('div', { class: 'ds-row ds-row--wrap' }, copyBtn, shareBtn, regenBtn),
        ui.toggleRow('Вступление по одобрению', 'По ссылке приходит заявка — админ принимает или отклоняет', apprToggle, 'ds-divided'),
        ui.toggleRow('Удалённые могут вернуться по ссылке', 'Выключи, чтобы тот, кого удалил организатор, не вошёл снова по той же ссылке', rejoinToggle, 'ds-divided'));
      if (!s.draw_done) {
        const partToggle = h('input', { type: 'checkbox', checked: d.me_member });
        bindToggle(partToggle, async (on) => {
          if (!on && !(await confirmBox('Выйти из события? Твоё письмо в этом событии будет удалено.'))) return false;
          await xapi('admin.participate', { on });
          toast(on ? 'Ты участвуешь' : 'Ты только организатор этого события');
          await refresh();
        });
        regCard.append(ui.toggleRow('Я участвую', 'Выключи, если ты только организатор этого события', partToggle, 'ds-divided'));
      }
      nodes.push(ui.section('Приглашение'), regCard);
      if (d.requests.length) {
        const reqList = h('div', { class: 'ds-card ds-card--flush' });
        for (const r of d.requests) {
          const decide = (approve) => busy(null, async () => {
            await xapi('admin.request.decide', { id: r.id, approve });
            toast(approve ? `✅ ${r.name} в событии` : 'Заявка отклонена');
            await refresh();
          });
          reqList.append(h('div', { class: 'ds-list-item' },
            h('div', { class: 'ds-grow' },
              h('div', { class: 'ds-list-item__title' }, r.name || 'без имени', r.username ? h('span', { class: 'ds-hint ds-text-regular' }, '  @' + r.username) : null),
              ui.hint(fmtTime(r.created_at))),
            h('div', { class: 'ds-row ds-row--tight' },
              h('button', { class: 'ds-icon-btn', title: 'Принять', onclick: () => decide(true) }, '✅'),
              h('button', { class: 'ds-icon-btn', title: 'Отклонить', onclick: () => decide(false) }, '❌'))));
        }
        nodes.push(ui.section(`Заявки · ${d.requests.length}`),
          s.registration_open ? null : ui.hint('Регистрация закрыта — принять заявку можно, когда откроешь её. Отклонить можно сейчас.', 'ds-hint--inset'),
          reqList);
      }
      // 010: удалённые организатором — при запрете возврата им можно точечно разрешить вернуться
      if (!s.rejoin && d.removed.length) {
        const remList = h('div', { class: 'ds-card ds-card--flush' });
        for (const r of d.removed) {
          const allow = ui.btn('Разрешить вернуться', 'secondary', 'ds-btn--sm');
          allow.addEventListener('click', () => busy(allow, async () => {
            await xapi('admin.removed.allow', { id: r.id });
            toast(`${r.name || 'Участник'} может вернуться по ссылке`);
            await again();
          }));
          remList.append(h('div', { class: 'ds-list-item' },
            h('div', { class: 'ds-grow' },
              h('div', { class: 'ds-list-item__title' }, r.name || 'без имени', r.username ? h('span', { class: 'ds-hint ds-text-regular' }, '  @' + r.username) : null),
              ui.hint('удалён ' + fmtTime(r.removed_at))),
            allow));
        }
        nodes.push(ui.section(`Удалённые · ${d.removed.length}`),
          ui.hint('Их удалил организатор, и по ссылке они не вернутся. «Разрешить вернуться» — и человек сможет войти по ссылке.', 'ds-hint--inset'),
          remList);
      }
      if (d.other_events.length) {
        const sel = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Из какого события…'), ...d.other_events.map((e) => h('option', { value: e.id }, e.title + (e.status === 'finished' ? ' (завершено)' : ''))));
        const inv = ui.btn('📨 Пригласить участников', 'secondary', 'ds-btn--block');
        inv.addEventListener('click', async () => {
          if (!sel.value) return toast('Выбери событие');
          if (!(await confirmBox('Бот пришлёт участникам выбранного события (кого ещё нет здесь) сообщение с кнопкой вступления. Отправить?'))) return;
          busy(inv, async () => { const r = await xapi('admin.event.invite_from', { from: +sel.value }); toast(r.count ? `Приглашения отправлены: ${r.count}` : 'Все уже здесь 👍'); });
        });
        // Закрытая регистрация — значит никто (010): приглашения не рассылаются
        inv.disabled = !s.registration_open;
        nodes.push(ui.card(ui.hint(s.registration_open
          ? 'Пригласить участников прошлого события — например, ту же компанию на следующий год.'
          : 'Пригласить участников прошлого события можно, когда регистрация открыта.'), sel, inv));
      }
      // 012: обращения участников — после всего, что касается приглашения, перед объявлением
      nodes.push(...supportNodes());
      // --- объявление (007); черновик переживает перерисовку панели (009)
      const annText = ui.textarea({ placeholder: 'Например: собираемся 28 декабря в 18:00, бюджет до 50 BYN', rows: 2, maxlength: 2000, value: drafts.announce || '' });
      const annBtn = ui.btn('📣 Отправить всем', 'secondary', 'ds-btn--block');
      const annUpdate = () => { drafts.announce = annText.value; annBtn.disabled = !annText.value.trim(); };
      annText.addEventListener('input', annUpdate);
      annUpdate();
      annBtn.addEventListener('click', async () => {
        if (!annText.value.trim()) return toast('Напиши текст объявления');
        if (!(await confirmBox('Бот отправит это объявление всем участникам события. Отправить?'))) return;
        const text = annText.value;
        busy(annBtn, async () => {
          const r = await xapi('admin.announce', { text });
          if (annText.value === text) annText.value = '';
          await reloadEvent(evId).catch(() => {});
          toast(`📣 Объявление отправлено: ${r.count}`);
        }).then(annUpdate);
      });
      nodes.push(ui.section('Объявление'),
        ui.card(ui.hint('Сообщение всем участникам от бота. Оно останется во вкладке «Инфо».'), annText, annBtn));
    } else {
      nodes.push(...supportNodes()); // завершённый эвент: обращения — на том же месте, перед участниками
    }

    // --- меню участника (004)
    const canRemove = (u) => !done && u.id !== me.id && !u.is_owner && (!u.is_admin || me.is_owner);
    // Переносит участие только владелец (010): админ мог бы перенести игрока на свой второй аккаунт и увидеть его пары
    const canTransfer = (u) => me.is_owner && u.registered && !u.is_owner;
    // На аккаунт администратора переносить нельзя: он получил бы чужие пары (006)
    const transferTargets = (u) => users.filter((x) => x.id !== u.id && x.registered && !x.in_draw && !x.is_admin);
    function openParticipantMenu(u, chips) {
      const items = [];
      if (u.registered) {
        const b = ui.btn('👁 Открыть письмо', 'secondary', 'ds-btn--block');
        b.addEventListener('click', async () => {
          if (!(await confirmBox(`Открыть письмо участника «${u.name}»? Ты увидишь его содержимое.`))) return;
          busy(b, async () => {
            const w = await xapi('admin.wishlist', { id: u.id });
            openSheet('Письмо: ' + w.name, w.wishlist ? h('div', { class: 'ds-card ds-letter' }, w.wishlist) : h('div', { class: 'ds-card ds-text-muted' }, 'Письмо пустое.'));
          });
        });
        items.push(b);
        // Администраторов переименовывает только владелец; себя — любой админ (006)
        const canRename = !(u.is_admin || u.is_owner) || me.is_owner || u.id === me.id;
        const r = ui.btn('✏️ Переименовать', 'secondary', 'ds-btn--block');
        if (canRename) r.addEventListener('click', () => {
          const inp = h('input', { class: 'ds-input', type: 'text', value: u.name, maxlength: 40 });
          const ok = ui.btn('Сохранить', '', 'ds-btn--block');
          ok.addEventListener('click', () => busy(ok, async () => { await api('admin.rename', { id: u.id, name: inp.value }); closeSheet(); toast('Имя изменено'); await refresh(); }));
          openSheet('Имя участника', [ui.hint('Имя одно на все события.'), inp, ok]);
        });
        if (canRename) items.push(r);
      }
      if (canTransfer(u) && transferTargets(u).length) {
        const b = ui.btn('🔁 Перенести на новый аккаунт', 'secondary', 'ds-btn--block');
        b.addEventListener('click', () => openTransfer(u));
        items.push(b);
      }
      if (canRemove(u)) {
        const b = ui.btn('🗑 Удалить из события', 'danger', 'ds-btn--block');
        b.addEventListener('click', async () => {
          const extra = s.draw_done && u.in_draw ? ' Жеребьёвка будет аккуратно поправлена: у одного-трёх участников сменится подопечный, бот их предупредит.' : '';
          if (!(await confirmBox(`Удалить «${u.name || 'без имени'}» из события «${s.title}»?${extra}`))) return;
          busy(b, async () => { await xapi('admin.remove', { id: u.id }); closeSheet(); toast('Участник удалён'); await again(); });
        });
        items.push(b);
      }
      if (u.is_owner) items.push(ui.hint('Владельца нельзя удалить или перенести: он может только передать права (главный экран → «Администраторы»).'));
      else if (!me.is_owner) items.push(ui.hint(u.is_admin
        ? 'Удалять администраторов и переносить участие может только владелец.'
        : 'Переносить участие на новый аккаунт может только владелец.'));
      openSheet(u.name || 'без имени', [
        h('div', {}, u.username ? ui.hint('@' + u.username) : null, h('div', { class: 'ds-chips' }, chips)),
        ...(items.length ? items : [ui.hint('Для этой записи действий нет.')]),
      ]);
    }
    function openTransfer(u) {
      const targets = transferTargets(u);
      const sel = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Новый аккаунт…'),
        ...targets.map((x) => h('option', { value: x.id }, x.name + (x.username ? ' (@' + x.username + ')' : ''))));
      const go = ui.btn('🔁 Перенести', '', 'ds-btn--block');
      go.addEventListener('click', async () => {
        const t = targets.find((x) => String(x.id) === sel.value);
        if (!t) return toast('Выбери новый аккаунт');
        if (!(await confirmBox(`Перенести участие «${u.name}» на «${t.name}»? Письма, подопечные, Санты и переписка во всех событиях перейдут на новый аккаунт, старая запись будет удалена.`))) return;
        busy(go, async () => { await api('admin.transfer', { from: u.id, to: t.id }); closeSheet(); toast('🔁 Участие перенесено'); await refresh(); });
      });
      openSheet('Перенести на новый аккаунт', [
        ui.hint(`Если «${u.name || 'участник'}» потерял доступ к Telegram и вступил в событие заново с нового аккаунта, выбери его новую запись. ` +
          'Новый аккаунт получит место старого во всех событиях: письма, подопечных и Сант, переписку, исключения. Пары остальных не изменятся.'),
        sel, go]);
    }

    // --- участники
    const filled = players.filter((u) => u.has_wishlist).length;
    const list = h('div', { class: 'ds-card ds-card--flush' });
    if (!users.length) list.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Пока никого нет.'));
    for (const u of users) {
      const chips = [];
      if (!u.registered) chips.push(ui.chip('регистрируется…'));
      else {
        chips.push(u.has_wishlist ? ui.chip('✉️ письмо есть', 'success') : ui.chip('✉️ письма нет', 'warning'));
        if (s.draw_done) {
          if (u.in_draw) chips.push(u.gift_ready ? ui.chip('🎁 готов', 'success') : ui.chip('🎁 не готов'));
          else chips.push(ui.chip('не в жеребьёвке', 'warning'));
          if (u.ward_seen === false) chips.push(ui.chip('👀 не открыл подопечного', 'warning'));
          if (u.gift_received) chips.push(ui.chip('📦 получил', 'success'));
        }
      }
      if (u.has_delivery === true) chips.push(ui.chip('📍 адрес указан', 'success'));
      else if (u.has_delivery === false && u.registered) chips.push(ui.chip('📍 адреса нет', 'warning'));
      if (u.blocked) chips.push(ui.chip('🚫 не получает сообщения', 'warning'));
      if (u.is_owner) chips.push(ui.chip('👑 владелец'));
      else if (u.is_admin) chips.push(ui.chip('🛠 админ'));
      const actions = h('div', { class: 'ds-row ds-row--tight' },
        h('button', { class: 'ds-icon-btn', title: 'Действия с участником', onclick: () => openParticipantMenu(u, chips.map((c) => c.cloneNode(true))) }, '⋯'));
      list.append(h('div', { class: 'ds-list-item' },
        h('div', { class: 'ds-grow' },
          h('div', { class: 'ds-list-item__title' }, u.name || 'без имени', u.username ? h('span', { class: 'ds-hint ds-text-regular' }, '  @' + u.username) : null),
          h('div', { class: 'ds-chips' }, chips)),
        actions));
      // Вписывает только владелец (012): админ по отметкам «не открыл» и «готов» понял бы, кто дарит новичку
      if (!done && s.draw_done && u.registered && !u.in_draw) {
        if (me.is_owner) {
          const ins = ui.btn('Вписать в жеребьёвку', '', 'ds-btn--sm');
          ins.addEventListener('click', async () => {
            if (!(await confirmBox(`Вписать «${u.name}» в жеребьёвку? Подопечный сменится у одного Санты: у того, кто его ещё не открыл, а если таких нет — у того, чей подарок не готов. Бот его предупредит.`))) return;
            busy(ins, async () => { await xapi('admin.insert', { id: u.id }); toast('Готово'); await again(); });
          });
          list.append(h('div', { class: 'ds-list-item ds-list-item--sub' }, ins));
        } else {
          list.append(h('div', { class: 'ds-list-item ds-list-item--sub' }, ui.hint('Вписать в жеребьёвку может владелец бота')));
        }
      }
    }
    nodes.push(
      ui.section(`Участники · ${players.length}`),
      ui.hint(`Письма написали ${filled} из ${players.length}. Письмо участника открывается только через «⋯» → «Открыть письмо».`, 'ds-hint--inset'),
      list);
    if (!done && players.length > filled) {
      const remindBtn = ui.btn('⏰ Напомнить тем, у кого нет письма', 'secondary', 'ds-btn--block');
      remindBtn.addEventListener('click', () => busy(remindBtn, async () => {
        const r = await xapi('admin.remind.unfilled');
        toast(r.count ? `Напоминание отправлено: ${r.count}` : 'Все уже написали письма 👍');
      }));
      nodes.push(remindBtn);
    }

    // --- исключения
    if (!done) {
      const exList = h('div', { class: 'ds-card ds-card--flush' });
      const seen = new Set();
      const exPairs = [];
      for (const e of d.exclusions) {
        const key = e.giver + ':' + e.receiver;
        if (seen.has(key)) continue;
        const mutual = d.exclusions.some((x) => x.giver === e.receiver && x.receiver === e.giver);
        seen.add(key);
        if (mutual) seen.add(e.receiver + ':' + e.giver);
        exPairs.push({ ...e, mutual });
      }
      if (!exPairs.length) exList.append(h('div', { class: 'ds-list-item ds-text-muted' }, 'Исключений нет — подарить может кто угодно кому угодно.'));
      // 009: после жеребьёвки исключения только для чтения — по заменам можно было бы вычислить пары.
      // Владелец пары видит и так — для него заморозки нет (010)
      const exFrozen = s.draw_done && !me.is_owner;
      for (const e of exPairs) {
        const a = byId[e.giver]?.name || '?', b = byId[e.receiver]?.name || '?';
        exList.append(h('div', { class: 'ds-list-item' },
          h('div', { class: 'ds-grow' }, e.mutual
            ? [h('b', {}, a), ' и ', h('b', {}, b), ' не дарят друг другу']
            : [h('b', {}, a), ' не дарит ', h('b', {}, b)]),
          exFrozen ? null : h('button', { class: 'ds-icon-btn', title: 'Удалить исключение', onclick: () => busy(null, async () => { await xapi('admin.exclusion.del', e); await again(); }) }, '✕')));
      }
      const opts = (ph) => [h('option', { value: '' }, ph), ...players.map((u) => h('option', { value: u.id }, u.name))];
      const selA = h('select', { class: 'ds-input' }, opts('Кто дарит…'));
      const selB = h('select', { class: 'ds-input' }, opts('…кому НЕ может дарить'));
      const mutual = h('input', { type: 'checkbox', checked: true });
      const addEx = ui.btn('Добавить исключение', 'secondary', 'ds-btn--block');
      addEx.addEventListener('click', () => busy(addEx, async () => {
        if (!selA.value || !selB.value) return toast('Выбери двух людей');
        if (selA.value === selB.value) return toast('Нужны два разных человека');
        await xapi('admin.exclusion.add', { giver: +selA.value, receiver: +selB.value, mutual: mutual.checked });
        toast('Исключение добавлено');
        await again();
      }));
      // 008: семьи эвента и правило «Учитывать семьи»
      const famCard = ui.card();
      const famOn = h('input', { type: 'checkbox', checked: s.families_on, disabled: s.draw_done });
      bindToggle(famOn, async (on) => {
        await xapi('admin.game', { families_on: on });
        toast(on ? 'Семьи учитываются' : 'Семьи не учитываются');
        await again();
      });
      famCard.append(ui.toggleRow('👪 Учитывать семьи', s.draw_done ? 'После жеребьёвки не меняется' : 'Члены одной семьи не дарят друг другу. Семьи задаются на главном экране.', famOn));
      for (const f of d.families) {
        famCard.append(h('div', { class: s.families_on ? 'ds-text-sm' : 'ds-text-sm ds-text-muted' },
          h('b', {}, f.name + ': '), f.members.map((id) => byId[id]?.name || '?').join(', ')));
      }
      nodes.push(
        ui.section('Исключения'),
        famCard,
        exList,
        exFrozen
          ? ui.hint('После жеребьёвки исключения не меняются: иначе по заменам участников можно было бы вычислить пары. Чтобы поменять их, отмени жеребьёвку (пока никто не открыл подопечного).', 'ds-hint--inset')
          : ui.card(
            ui.hint(s.draw_done
              ? 'После жеребьёвки исключения действуют на будущие замены (удаление и вписывание участников), текущие пары не меняются. Админы их уже не меняют — так они не вычислят пары.'
              : 'Например, пары или члены одной семьи. Бот не даст жеребьёвке нарушить эти правила.'),
            selA, selB,
            h('label', { class: 'ds-check' }, mutual, 'и наоборот (в обе стороны)'),
            addEx));
    }

    // --- жеребьёвка
    const drawCard = ui.card();
    if (!s.draw_done) {
      const ring = h('input', { type: 'checkbox', checked: s.ring });
      bindToggle(ring, async (on) => {
        await xapi('admin.ring', { on });
        toast(on ? 'Кольцевая жеребьёвка включена' : 'Кольцевая жеребьёвка выключена');
        await reloadEvent(evId).catch(() => {});
      });
      drawCard.append(ui.toggleRow('🔁 Кольцевая жеребьёвка',
        'Если А дарит Б, то Б не дарит А. Нужно минимум 3 участника. После жеребьёвки не меняется.', ring));
      if (d.other_events.length) {
        const av = h('input', { type: 'checkbox', checked: s.avoid_previous });
        bindToggle(av, async (on) => { await xapi('admin.avoid_previous', { on }); });
        drawCard.append(h('label', { class: 'ds-check' }, av, 'Не повторять пары прошлого события с этими людьми (если получится)'));
      }
      const drawBtn = ui.btn('🎲 Провести жеребьёвку', 'festive', 'ds-btn--block');
      const result = h('div');
      drawBtn.addEventListener('click', () => busy(drawBtn, async () => {
        const c = await xapi('admin.draw.check');
        result.replaceChildren();
        if (!c.possible) {
          haptic('error');
          result.append(h('div', { class: 'ds-notice ds-notice--error' }, h('b', {}, 'Жеребьёвка невозможна:'), h('ul', { class: 'ds-bullets' }, c.problems.map((p) => h('li', {}, p)))));
          return;
        }
        // Окно подтверждения Telegram — до 250 символов (009): важное сначала, вместо списка имён — число
        const k = c.empty_wishlists.length;
        let text = `Провести жеребьёвку для ${c.count} ${plural(c.count, 'участника', 'участников', 'участников')}${c.ring ? ' (кольцевая)' : ''}? Отменить её можно, пока никто не открыл подопечного.`;
        if (k) text += `\n\nПисьма ещё нет у ${k} ${plural(k, 'участника', 'участников', 'участников')} — его можно написать и позже.`;
        if (!(await confirmBox(text))) return;
        const r = await xapi('admin.draw');
        haptic('success');
        toast(`🎉 Жеребьёвка проведена! Участников: ${r.count}`);
        await refresh();
      }));
      drawCard.append(
        ui.hint('Когда все вступят — жми. Бот проверит, что правила можно соблюсти, и разошлёт уведомления. ' + (me.is_owner
          ? 'Кто кому дарит, не видно и тебе: пары открываются только в служебном просмотре внизу панели (с записью в журнал).'
          : 'Кто кому дарит, админы не видят.')),
        drawBtn, result);
    } else {
      const inDraw = players.filter((u) => u.in_draw);
      const ready = inDraw.filter((u) => u.gift_ready).length;
      drawCard.append(
        h('div', {}, h('div', { class: 'ds-text-strong' }, '✅ Жеребьёвка проведена' + (s.ring ? ' (кольцевая)' : '')), s.draw_at ? ui.hint(fmtTime(s.draw_at)) : null),
        h('div', { class: 'ds-notice' }, `🎁 Подарки готовы: ${ready} из ${inDraw.length} · 📦 получено: ${inDraw.filter((u) => u.gift_received).length} из ${inDraw.length}`));
      if (s.draw_cancelable) {
        // 007: отменить можно, пока никто не открыл подопечного и переписки нет
        const cancel = ui.btn('↩️ Отменить жеребьёвку', 'secondary', 'ds-btn--block');
        cancel.addEventListener('click', async () => {
          if (!(await confirmBox('Отменить жеребьёвку? Пары удалятся, письма останутся, регистрация снова откроется. Участники получат уведомление.'))) return;
          busy(cancel, async () => { await xapi('admin.draw.cancel'); toast('↩️ Жеребьёвка отменена'); await refresh(); });
        });
        drawCard.append(ui.hint('Никто ещё не открыл подопечного — жеребьёвку можно отменить, например, чтобы добавить людей.'), cancel);
      }
      if (!done) {
        const remindS = ui.btn('🎁 Напомнить Сантам о подарках', 'secondary', 'ds-btn--block');
        remindS.addEventListener('click', () => busy(remindS, async () => {
          const r = await xapi('admin.remind.santas');
          toast(r.count ? `Напоминание отправлено: ${r.count}` : 'Все подарки готовы 👍');
        }));
        drawCard.append(remindS);
      }
      const reveal = ui.btn(s.revealed ? '🎅 Тайна уже раскрыта' : '🎅 Раскрыть Сант (после праздника)', 'secondary', 'ds-btn--block');
      reveal.disabled = s.revealed; // повторно имена Сант не рассылаются (006)
      reveal.addEventListener('click', async () => {
        if (!(await confirmBox('Каждый участник получит сообщение, кто был его Сантой. Делай это после вручения подарков. Раскрыть?'))) return;
        busy(reveal, async () => { const r = await xapi('admin.reveal'); toast(`Отправлено: ${r.count}`); await again(); });
      });
      drawCard.append(reveal);
    }
    if (!done) {
      const fin = ui.btn('🏁 Завершить', 'danger', 'ds-btn--block');
      fin.addEventListener('click', async () => {
        if (!(await confirmBox('Завершить событие? Письма и отметки станут только для чтения, регистрация закроется, переписка останется открытой ещё 7 дней. Вернуть событие в «идёт» нельзя.'))) return;
        busy(fin, async () => { await xapi('admin.event.finish'); toast('🏁 Событие завершено'); await refresh(); });
      });
      drawCard.append(ui.hint('Когда подарки вручены — заверши событие: оно останется в истории у всех участников.'), fin);
    }
    nodes.push(ui.section('Жеребьёвка'), drawCard);

    // --- параметры эвента
    if (!done) {
      // Черновик параметров (009): несохранённые правки переживают перерисовку панели после других действий
      const g = drafts.game || {};
      const val = (k) => (k in g ? g[k] : s[k]);
      const f = {
        title: h('input', { class: 'ds-input', type: 'text', value: val('title'), maxlength: 80 }),
        budget: h('input', { class: 'ds-input', type: 'text', value: val('budget'), placeholder: 'например, до 50 BYN', maxlength: 100 }),
        event_date: ui.date(val('event_date')),
        place: h('input', { class: 'ds-input', type: 'text', value: val('place'), placeholder: 'например, у Маши дома', maxlength: 200 }),
        deadline: ui.date(val('deadline')),
        notes: ui.textarea({ value: val('notes'), placeholder: 'Любые правила и детали для всех', rows: 2, maxlength: 2000 }),
      };
      // Расписание (007): автожеребьёвка (до жеребьёвки), авто-раскрытие и автозавершение
      if (!s.draw_done) f.draw_auto_date = ui.date(val('draw_auto_date'));
      const checks = {
        delivery_on: h('input', { type: 'checkbox', checked: val('delivery_on') }),
        reveal_auto: h('input', { type: 'checkbox', checked: val('reveal_auto') }),
        finish_auto: h('input', { type: 'checkbox', checked: val('finish_auto') }),
      };
      const saveGame = ui.btn('Сохранить', '', 'ds-btn--block');
      // Авто-раскрытие и автозавершение считаются от даты вручения: без неё не сработают (009)
      const noDate = ui.hint('⚠️ Авто-раскрытие и автозавершение сработают, только когда указана дата вручения.');
      const values = () => ({
        ...Object.fromEntries(Object.entries(f).map(([k, el]) => [k, el.value])),
        ...Object.fromEntries(Object.entries(checks).map(([k, el]) => [k, el.checked])),
      });
      const onEdit = () => {
        drafts.game = values();
        noDate.hidden = !((checks.reveal_auto.checked || checks.finish_auto.checked) && !f.event_date.value);
      };
      for (const el of [...Object.values(f), ...Object.values(checks)]) {
        el.addEventListener('input', onEdit);
        el.addEventListener('change', onEdit);
      }
      noDate.hidden = !((checks.reveal_auto.checked || checks.finish_auto.checked) && !f.event_date.value);
      saveGame.addEventListener('click', () => busy(saveGame, async () => {
        await xapi('admin.game', values());
        delete drafts.game;
        await reloadEvent(evId).catch(() => {});
        await reloadMe().catch(() => {});
        if (!live()) return;
        renderHero();
        haptic('success');
        toast('Сохранено');
      }));
      const field = (label, el) => h('label', { class: 'ds-field' }, h('span', { class: 'ds-field__label' }, label), el);
      nodes.push(
        ui.section('Параметры'),
        ui.card(
          field('Название', f.title),
          field('Бюджет подарка', f.budget),
          field('Дата вручения', f.event_date),
          field('Место', f.place),
          field('Написать письмо до', f.deadline),
          field('Заметки для всех', f.notes),
          h('label', { class: 'ds-check' }, checks.delivery_on, 'Подарки отправляют — спросить адрес доставки (увидит только Санта)'),
          ui.hint('Бот сам напомнит: за 2 дня, за день и в день срока письма — тем, у кого его нет; за 2 дня и в день вручения — Сантам без отметки «подарок готов».'),
          f.draw_auto_date ? field('Автожеребьёвка', f.draw_auto_date) : null,
          h('label', { class: 'ds-check' }, checks.reveal_auto, 'Раскрыть Сант на следующий день после вручения'),
          h('label', { class: 'ds-check' }, checks.finish_auto, 'Завершить через 3 дня после вручения'),
          noDate,
          ui.hint('Автодействия бот выполняет в час ежедневных напоминаний. Если автожеребьёвка не получится, бот напишет админам.'),
          saveGame));
    }

    // --- журнал (007): по эвенту, доступен и для завершённого
    const logBtn = ui.btn('📜 Журнал действий', 'secondary', 'ds-btn--block');
    logBtn.addEventListener('click', () => openAudit(state.evId));
    nodes.push(ui.section('Журнал'), ui.card(ui.hint('Кто из админов что делал в этом событии и что бот сделал сам. Пар и писем в журнале нет.'), logBtn));

    // --- служебный просмотр (010): только владелец, вход словом, каждое открытие — в журнал
    if (me.is_owner) {
      const vaultBtn = ui.btn('🔐 Открыть служебный просмотр', 'secondary', 'ds-btn--block');
      vaultBtn.addEventListener('click', () => openVaultGate(evId, s, users, d.me_member));
      nodes.push(
        ui.section('Служебный просмотр'),
        ui.card(ui.hint('Только для владельца бота: кто кому дарит, письма, адреса и переписка — если что-то пошло не так. ' +
          'Каждое открытие записывается в журнал события, его видят все админы.'), vaultBtn));
    }

    // --- опасная зона (004/005): только владелец
    if (me.is_owner) {
      // keep (012) — что останется (необязательно): отдельной строкой под списком удаляемого
      const typed = (title, lines, word, label, action, after, keep = '') => () => {
        const inp = h('input', { class: 'ds-input', type: 'text', placeholder: `Введи слово ${word}`, autocomplete: 'off' });
        const go = ui.btn(label, 'danger', 'ds-btn--block');
        go.disabled = true;
        inp.addEventListener('input', () => { go.disabled = inp.value.trim().toUpperCase() !== word; });
        go.addEventListener('click', async () => {
          if (!(await confirmBox(`${title}: точно? Это нельзя отменить.`))) return;
          busy(go, async () => { const r = await xapi(action, { confirm: word }); closeSheet(); await after(r); });
        });
        openSheet(title, [
          h('div', { class: 'ds-notice ds-notice--error' }, h('b', {}, 'Будет удалено без возможности восстановления:'), h('ul', { class: 'ds-bullets' }, lines.map((l) => h('li', {}, l)))),
          keep ? ui.hint(keep) : null,
          inp, go]);
      };
      const resetBtn = ui.btn('🧨 Полный сброс', 'danger', 'ds-btn--block');
      resetBtn.addEventListener('click', typed('Полный сброс', [
        'все участники этого события, кроме тебя;',
        'письма, пары, исключения, отметки «подарок готов», переписка;',
        'параметры; пригласительная ссылка станет новой.',
      ], 'СБРОС', '🧨 Сбросить', 'admin.reset.full', async (r) => { toast(`Событие сброшено. Удалено: ${r.removed}`); await refresh(); }));
      const delBtn = ui.btn('🗑 Удалить событие', 'danger', 'ds-btn--block');
      delBtn.addEventListener('click', typed('Удалить событие', [
        `событие «${s.title}» целиком — оно пропадёт из истории у всех;`,
        'письма, пары, исключения и переписка этого события.',
      ], 'УДАЛИТЬ', '🗑 Удалить навсегда', 'admin.event.delete', async () => { toast('Событие удалено'); await goHome(); }));
      // 012: принудительная отмена — в любой момент до раскрытия, даже если подопечных уже открыли
      let forceBtn = null;
      if (s.draw_done && !s.revealed) {
        forceBtn = ui.btn('↩️ Отменить жеребьёвку', 'danger', 'ds-btn--block');
        forceBtn.addEventListener('click', typed('Отменить жеребьёвку', [
          'кто кому дарит — все пары этого события;',
          'отметки «подарок готов» и «получил»;',
          'вся переписка Сант и подопечных в этом событии.',
        ], 'ОТМЕНА', '↩️ Отменить жеребьёвку', 'admin.draw.cancel.force', async (r) => { toast(`↩️ Жеребьёвка отменена. Пар удалено: ${r.count}`); await refresh(); },
        'Останутся письма, адреса, участники, исключения и семьи. Регистрация снова откроется, участники получат уведомление.'));
      }
      nodes.push(
        ui.section('Опасная зона'),
        finished()
          ? ui.card(ui.hint('Завершённое событие нельзя сбросить — только удалить целиком. Другие события это не затронет.'), delBtn)
          : ui.card(ui.hint('Другие события это не затронет. Для тестового прогона удобно потом удалить событие целиком.' +
            (forceBtn ? ' Отменить жеребьёвку здесь можно, даже если подопечных уже открыли, — пока тайна не раскрыта.' : '')), forceBtn, resetBtn, delBtn));
    }

    main.replaceChildren(...nodes.filter(Boolean));
  }

  // ---------- служебный просмотр владельца (010) ----------
  // Вход — вводом слова ОТКРЫТЬ (как СБРОС и УДАЛИТЬ), чтобы владелец, который сам играет, не увидел пары случайно
  function openVaultGate(evId, s, users, meMember) {
    const word = 'ОТКРЫТЬ';
    const inp = h('input', { class: 'ds-input', type: 'text', placeholder: `Введи слово ${word}`, autocomplete: 'off' });
    const go = ui.btn('🔐 Войти', '', 'ds-btn--block');
    go.disabled = true;
    inp.addEventListener('input', () => { go.disabled = inp.value.trim().toUpperCase() !== word; });
    go.addEventListener('click', () => openVault(evId, s, users, meMember));
    openSheet('🔐 Служебный просмотр', [
      meMember ? h('div', { class: 'ds-notice ds-notice--error' }, h('b', {}, 'Ты участник этого события. '),
        'В полной таблице пар ты увидишь своего Санту. Лучше смотри по одному участнику и не открывай себя.') : null,
      h('div', { class: 'ds-notice' }, 'Здесь видно, кто кому дарит, письма, адреса и переписку. Каждое открытие участника или всех пар ' +
        'записывается в журнал события — его видят все админы. Статусы участников просмотр не меняет.'),
      inp, go].filter(Boolean));
  }

  function openVault(evId, s, users, meMember) {
    const vapi = (action, body) => api(action, { ...(body || {}), event: evId });
    const sel = h('select', { class: 'ds-input' }, h('option', { value: '' }, 'Участник…'),
      ...users.map((u) => h('option', { value: u.id }, (u.name || 'без имени') + (u.id === state.me.id ? ' (ты)' : ''))));
    const showBtn = ui.btn('👁 Открыть участника', '', 'ds-btn--block');
    const personBox = h('div', { class: 'ds-stack' });
    showBtn.addEventListener('click', async () => {
      const u = users.find((x) => String(x.id) === sel.value);
      if (!u) return toast('Выбери участника');
      if (u.id === state.me.id && !(await confirmBox('Это ты: увидишь своего Санту. Открыть?'))) return;
      busy(showBtn, async () => personBox.replaceChildren(...vaultPerson(await vapi('admin.vault.person', { id: u.id }), s)));
    });
    const pairsBtn = ui.btn('📋 Показать все пары', 'secondary', 'ds-btn--block');
    const pairsBox = h('div', { class: 'ds-stack' });
    pairsBtn.addEventListener('click', async () => {
      const warn = meMember ? ' Ты участник — увидишь и своего Санту.' : '';
